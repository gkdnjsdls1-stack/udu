<title>우두국 입국관리소</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;700&display=swap">
<style>
/* 종이 위의 공문서. 한 열, 가운데 정렬, 여권 지면 비율을 기준으로 한 세로 리듬. */
:root{
  --paper:#FAF7F0;        /* 우두벌 백 */
  --ink:#2B2B28;          /* 공문 묵색 */
  --ink-soft:rgba(43,43,40,.72);
  --ink-faint:rgba(43,43,40,.46);
  --rule:rgba(43,43,40,.24);
  --river:#16646B;        /* 양강 청록 */
  --hill:#D9A85A;         /* 우두산 황토 */
  --seal:#C1382B;         /* 입국 주인 — 도장에만 */
  --grid:rgba(22,100,107,.055);
  --surface:#FFFFFF;
  /* 영토색 — 국민이 고른다. 주인색은 여기 없다 */
  --own-river:#16646B; --own-hill:#B5873F; --own-pine:#3E5D4A; --own-clay:#8A5A44; --own-ink:#2B2B28;
  --serif:"Noto Serif KR",'Nanum Myeongjo',Batang,'Times New Roman',serif;
  --mono:ui-monospace,'Cascadia Mono',Consolas,'DejaVu Sans Mono',monospace;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#1A1A18; --ink:#F2EFE7;
    --ink-soft:rgba(242,239,231,.74); --ink-faint:rgba(242,239,231,.46);
    --rule:rgba(242,239,231,.26);
    --river:#4FA6AD; --hill:#E0B775;
    --seal:#E8574A; --grid:rgba(79,166,173,.07);
    --own-river:#4FA6AD; --own-hill:#E0B775; --own-pine:#7FA98C; --own-clay:#C08A6E; --own-ink:#F2EFE7;
    --surface:#232320; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#1A1A18; --ink:#F2EFE7;
  --ink-soft:rgba(242,239,231,.74); --ink-faint:rgba(242,239,231,.46);
  --rule:rgba(242,239,231,.26);
  --river:#4FA6AD; --hill:#E0B775;
  --seal:#E8574A; --grid:rgba(79,166,173,.07);
  --own-river:#4FA6AD; --own-hill:#E0B775; --own-pine:#7FA98C; --own-clay:#C08A6E; --own-ink:#F2EFE7;
  --surface:#232320; color-scheme:dark;
}
*{box-sizing:border-box}
body{
  background:var(--paper); color:var(--ink);
  font-family:var(--serif);
  background-image:
    repeating-linear-gradient(0deg,var(--grid) 0 1px,transparent 1px 16px),
    repeating-linear-gradient(90deg,var(--grid) 0 1px,transparent 1px 16px);
  -webkit-text-size-adjust:100%;
}
.wrap{
  max-width:34rem; margin-inline:auto;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:1.75rem 3rem;
}
h1,h2,h3{margin:0;text-wrap:balance;font-weight:700}
p{margin:0}
.eyebrow{font-size:.72rem;letter-spacing:.34em;color:var(--ink-faint);text-transform:none}
.rule{height:1px;background:var(--rule);border:0;margin:0}
button{font:inherit;color:inherit;cursor:pointer}
.btn{
  display:block;width:100%;padding:.95rem 1rem;border:1.5px solid var(--ink);
  background:transparent;border-radius:2px;font-weight:700;font-size:1.02rem;
  letter-spacing:.06em;min-height:48px;
}
.btn:hover{background:var(--ink);color:var(--paper)}
.btn-primary{background:var(--ink);color:var(--paper)}
.btn-primary:hover{opacity:.86}
.btn-quiet{border-color:var(--rule);font-weight:400;font-size:.9rem;letter-spacing:.04em}
.btn:focus-visible,.opt:focus-visible,.lnk:focus-visible{outline:2px solid var(--river);outline-offset:3px}
.lnk{background:none;border:0;padding:.4rem 0;text-decoration:underline;text-underline-offset:3px;font-size:.88rem;color:var(--ink-soft)}
.stack{display:flex;flex-direction:column;gap:1.1rem}
.stack-sm{display:flex;flex-direction:column;gap:.55rem}

/* 국기 — 테두리는 SVG 안이 아니라 여기서 긋는다. 안에서 그으면 선이 뷰박스에
   맞춰 축소돼 46px 에서 사라지고, 획의 바깥 절반이 뷰박스에 잘린다.
   바탕색(--paper)이 페이지 배경과 같아서 이 선이 없으면 깃발의 네 변이 안 보인다 */
.flag{display:block;height:auto;border:1px solid var(--rule)}

/* 랜딩 */
.facts{display:grid;grid-template-columns:1fr auto;gap:.5rem 1rem;font-size:.92rem}
.facts dt{color:var(--ink-soft)}
.facts dd{margin:0;font-variant-numeric:tabular-nums;text-align:right}

/* 심사 무대 */
.stage{
  position:relative;overflow:hidden;background:var(--surface);
  border:1px solid var(--rule);border-radius:2px;
  min-height:clamp(380px,62vh,520px);
  display:flex;align-items:center;justify-content:center;
  padding:1.5rem 1.1rem;text-align:center;
}
.stage.dark{background:var(--ink);color:var(--paper);border-color:transparent}
.stage.dark .eyebrow{color:rgba(250,247,240,.6)}
.surveyor{width:72px;height:72px;margin-inline:auto;display:block}
.surveyor g{animation:spin 2.4s linear infinite;transform-origin:50% 50%}
@keyframes spin{to{transform:rotate(360deg)}}
.coord{font-family:var(--mono);font-size:.78rem;letter-spacing:.04em;opacity:.7}
.dots span{animation:blink 1.2s infinite}
.dots span:nth-child(2){animation-delay:.2s}
.dots span:nth-child(3){animation-delay:.4s}
@keyframes blink{0%,100%{opacity:.25}50%{opacity:1}}

/* 심사 질문 */
.opt{
  display:flex;width:100%;gap:.7rem;align-items:center;text-align:left;
  padding:.85rem .9rem;border:1px solid var(--rule);background:transparent;
  border-radius:2px;font-size:.95rem;min-height:48px;
}
.opt:hover{border-color:var(--ink)}
.opt[aria-pressed="true"]{border-color:var(--ink);background:var(--ink);color:var(--paper)}
.opt .mark{width:11px;height:11px;border:1px solid currentColor;border-radius:50%;flex:0 0 auto}
.opt[aria-pressed="true"] .mark{background:currentColor}

/* 도장 */
.stamp-wrap{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%)}
.stamp-wrap.drop{animation:drop .18s cubic-bezier(.2,.9,.1,1) both}
@keyframes drop{from{transform:translate(-50%,-50%) translateY(-42vh) scale(1.4);opacity:.88}to{transform:translate(-50%,-50%) translateY(0) scale(1);opacity:1}}
.stage.shake{animation:shake .08s steps(2,end) 2}
@keyframes shake{0%{transform:translate(0,0)}25%{transform:translate(-3px,1px)}75%{transform:translate(3px,-1px)}100%{transform:translate(0,0)}}
.stamp{
  position:relative;width:min(270px,78vw);aspect-ratio:3/2;
  border:3px solid var(--seal);border-radius:5px;padding:7px;color:var(--seal);
  transform:rotate(-8deg);
  box-shadow:0 0 2px rgba(193,56,43,.45);
}
.stamp.bleed{animation:bleed .3s ease-out both}
@keyframes bleed{to{box-shadow:0 0 5px 1px rgba(193,56,43,.42);transform:rotate(-8deg) scale(1.015);filter:blur(.35px)}}
.stamp.exit{border-style:dashed}
.stamp.exit .stamp-wm{opacity:.085}   /* 도장이 작아지면 언덕이 날짜를 덮는다 */
/* 입국 실선 · 출국 파선 · 측량 점선 + 네 모서리 등록 표식.
   입국·출국이 관인이라면 측량은 야장이다. 모서리 표식이 그 차이를 혼자 다 낸다 */
.stamp.survey{border-style:dotted}
.stamp-reg{position:absolute;inset:0;width:100%;height:100%;opacity:.85;pointer-events:none}
.stamp-in{
  height:100%;border:1.5px solid var(--seal);border-radius:3px;overflow:hidden;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;position:relative;
}
.stamp.exit .stamp-in{border-style:dashed}
.stamp.survey .stamp-in{border-style:dotted}
.stamp-wm{position:absolute;bottom:-6%;right:-10%;width:72%;opacity:.12}
.stamp-han{font-size:.78rem;letter-spacing:.44em;text-indent:.44em;position:relative}
.stamp-big{font-size:clamp(2.1rem,11vw,2.9rem);font-weight:700;letter-spacing:.16em;text-indent:.16em;line-height:1.02;position:relative;text-shadow:0 0 1.5px rgba(193,56,43,.4)}
.stamp-date{font-size:.95rem;letter-spacing:.16em;position:relative;font-variant-numeric:tabular-nums}
.stamp-sub{font-size:.68rem;letter-spacing:.2em;opacity:.86;position:relative}

/* 승인서 */
.record{display:grid;grid-template-columns:auto 1fr;gap:.6rem 1.1rem;font-size:.95rem;text-align:left}
.record dt{color:var(--ink-soft);white-space:nowrap}
.record dd{margin:0;font-weight:700}
.record dd.soft{font-weight:400}      /* 값이 아니라 문장인 행 */
.badge{border:1.5px solid var(--seal);padding:.6rem .8rem;border-radius:2px;text-align:left}
.badge b{display:block;color:var(--seal);font-size:.98rem;letter-spacing:.04em}
.badge span{display:block;font-size:.76rem;color:var(--seal);opacity:.85;margin-top:.2rem}

/* 여권 홈 */
.pp{background:var(--surface);border:1px solid var(--rule);border-radius:2px;padding:1.1rem}
.pp-head{display:flex;gap:.9rem;align-items:flex-start}
.photo{width:62px;height:78px;flex:0 0 auto;border:1px solid var(--rule);background:var(--grid);display:grid;place-items:end center;overflow:hidden}
.photo svg{width:48px;height:48px}
.meta{display:grid;gap:.45rem;min-width:0}
.meta .k{font-size:.64rem;letter-spacing:.2em;color:var(--ink-faint)}
.meta .v{font-size:.95rem;font-weight:700;overflow-wrap:anywhere}
.grid-stamps{display:grid;grid-template-columns:repeat(4,1fr);gap:.5rem}
.cell{position:relative;aspect-ratio:1;border:1px dashed var(--rule);border-radius:2px;display:grid;place-items:center;font-size:.62rem;color:var(--ink-faint);padding:.2rem;text-align:center;line-height:1.3;white-space:pre-line}
/* 빈 칸의 등록 표식 — "채워질 자리"라고 말한다. 화면설계: 빈 도장 칸이 보여야 한다.
   측량 도장의 모서리 표식과 같은 모티프다. 두 곳이 한 화면에 같이 나오지 않는다 */
.cell-reg{position:absolute;inset:0;width:100%;height:100%;opacity:.38;pointer-events:none;color:var(--ink)}
.cell.on{border:1.5px solid var(--seal);border-style:solid;color:var(--seal);font-weight:700}
.cell .ico.faint{color:var(--ink-faint);width:21px;height:21px;margin-bottom:2px}
.mrz{font-family:var(--mono);font-size:.64rem;line-height:1.8;letter-spacing:.03em;color:var(--ink-soft);white-space:pre-line;overflow-x:auto}
.rate{display:flex;justify-content:space-between;align-items:baseline;font-size:.9rem}
.rate b{font-variant-numeric:tabular-nums}

/* 카드 */
.cardbox{background:var(--surface);border:1px solid var(--rule);padding:.6rem;border-radius:2px}
.cardbox canvas{display:block;width:100%;height:auto}

/* 모의 패널 */
.sim{border:1px dashed var(--rule);border-radius:2px;padding:.8rem}
.sim-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(8.5rem,1fr));gap:.4rem}
.sim-grid button{padding:.55rem .5rem;border:1px solid var(--rule);background:transparent;border-radius:2px;font-size:.78rem}
.sim-grid button:hover{border-color:var(--ink)}
.sim-grid button[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
/* 미션 */
.cat{border:1px solid var(--rule);border-radius:2px;overflow:hidden}
.cat>button{display:flex;width:100%;align-items:center;gap:.7rem;padding:.85rem .9rem;background:transparent;border:0;text-align:left;min-height:48px}
.cat>button:hover{background:var(--grid)}
.cat h3{font-size:1rem;letter-spacing:.06em;flex:1 1 auto;min-width:0}
.pips{display:flex;gap:4px;flex:0 0 auto}
.pip{width:9px;height:9px;border:1px solid var(--ink-faint);border-radius:50%}
.pip.on{background:var(--seal);border-color:var(--seal)}
.chev{font-size:.8rem;color:var(--ink-faint);flex:0 0 auto}
.mrow{display:flex;width:100%;gap:.7rem;align-items:flex-start;padding:.8rem .9rem;border:0;border-top:1px solid var(--rule);background:transparent;text-align:left;min-height:48px}
.mrow:hover{background:var(--grid)}
.mrow .num{font-size:.72rem;color:var(--ink-faint);width:1.6rem;flex:0 0 auto;font-variant-numeric:tabular-nums;padding-top:.2rem}
.mrow .nm{font-weight:700;font-size:.95rem;display:block}
.mrow .sub{font-size:.78rem;color:var(--ink-soft);display:block;margin-top:.2rem;line-height:1.5}
.diff{font-size:.72rem;color:var(--hill);letter-spacing:.14em;flex:0 0 auto;padding-top:.25rem}
.tag{display:inline-block;font-size:.66rem;letter-spacing:.12em;border:1px solid var(--rule);border-radius:999px;padding:.14rem .55rem;color:var(--ink-soft)}
.tag.ok{border-color:var(--seal);color:var(--seal);font-weight:700}
.script{font-size:.96rem;line-height:2.05}
.script p{margin:0 0 1.15rem}
.script p:last-child{margin-bottom:0}
.script .q{padding-left:1rem;border-left:2px solid var(--rule)}
.script .slot{color:var(--ink-faint);font-size:.86rem}
.shots{display:flex;gap:.5rem;flex-wrap:wrap}
.shots img{width:72px;height:72px;object-fit:cover;border:1px solid var(--rule);display:block}
.filelbl{display:block;position:relative;width:100%;padding:.95rem 1rem;border:1.5px dashed var(--ink);border-radius:2px;text-align:center;font-weight:700;cursor:pointer;min-height:48px}
.filelbl input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer}
.numrow{display:flex;gap:.5rem}
.numrow input{flex:1 1 auto;min-width:0;padding:.85rem .9rem;border:1.5px solid var(--ink);border-radius:2px;background:transparent;color:inherit;font:inherit;font-variant-numeric:tabular-nums}
.numrow button{flex:0 0 auto;width:auto;padding-inline:1.2rem}
.big{font-size:2.7rem;font-weight:700;font-variant-numeric:tabular-nums;text-align:center;letter-spacing:.02em;line-height:1.1}

/* 도면 — 위성사진이 아니라 측량도면이다. 타일을 깔지 않는다.
   흰 카드에 넣지 않는다. 종이 위에 그린 그림이어야 해서 바탕을 비우고 도면 테두리만 두른다 */
.plan{position:relative;padding:.7rem;border:1px solid var(--rule);
  box-shadow:inset 0 0 0 4px var(--paper), inset 0 0 0 5px var(--rule)}
.plan svg{display:block;width:100%;height:auto}
.plan .north{position:absolute;top:.9rem;left:1rem;display:flex;flex-direction:column;
  align-items:center;gap:1px;color:var(--ink-faint);font-size:.56rem;letter-spacing:.1em}
.plan .north svg{width:11px;height:16px}
.title-blk{position:absolute;right:.95rem;bottom:.95rem;border:1px solid var(--rule);
  background:var(--paper);padding:.35rem .5rem;font-size:.58rem;line-height:1.75;
  color:var(--ink-soft);display:grid;grid-template-columns:auto auto;gap:0 .6rem}
.title-blk dt{color:var(--ink-faint);letter-spacing:.08em}
.title-blk dd{margin:0;font-variant-numeric:tabular-nums;text-align:right;overflow-wrap:anywhere}
/* 좁은 화면에서는 표제란이 도면 폭의 40% 를 먹는다. 제일 긴 줄을 뺀다 —
   측량자 번호는 신분증에 이미 있다 */
@media (max-width:480px){ .title-blk .who{display:none} }
/* 선은 전부 non-scaling-stroke 다. 굵기를 미터로 주면 폰에서 0.2px 가 되어 사라진다.
   원은 스케일을 타므로 반지름은 폰 기준으로 잡았다 (넓은 화면에서 조금 커진다) */
.plan [class]{vector-effect:non-scaling-stroke}
.plan .edge{fill:none;stroke:var(--river);stroke-width:1.6;opacity:.55}   /* 강 */
.plan .edge.drawn{stroke:var(--ink-faint);stroke-dasharray:4 3;stroke-width:1.1;opacity:.9}
.plan .land{fill:var(--ink);opacity:.035;stroke:none}
/* 격자는 칸마다 네모를 그리지 않는다. 그러면 표가 된다 — 땅 모양으로 잘린 괘선이어야 한다 */
.plan .gl{stroke:var(--ink);stroke-width:.75;opacity:.3;fill:none}
.plan .own{stroke:none}      /* 아래에서 차오른다. 불투명도가 아니라 높이가 는다 */
.plan .seed{fill:var(--ink);opacity:.55;stroke:none}
.plan .mine{fill:var(--paper);stroke:var(--ink);stroke-width:1.4}
.plan .here{fill:none;stroke:var(--river);stroke-width:2}
.own-river{color:var(--own-river)} .own-hill{color:var(--own-hill)} .own-pine{color:var(--own-pine)}
.own-clay{color:var(--own-clay)} .own-ink{color:var(--own-ink)}
.swatch{display:flex;gap:.45rem;flex-wrap:wrap}
.swatch button{display:flex;align-items:center;gap:.4rem;padding:.4rem .6rem;border:1px solid var(--rule);
  background:transparent;border-radius:2px;font-size:.78rem;color:var(--ink-soft)}
.swatch button[aria-pressed="true"]{border-color:var(--ink);color:var(--ink);font-weight:700}
/* 견본 색은 i 에 직접 건다. 버튼에 걸면 .swatch button 의 color 가 이긴다 */
.swatch i{width:12px;height:12px;border-radius:2px;flex:0 0 auto;border:1px solid var(--rule)}
.swatch i.own-river{background:var(--own-river)} .swatch i.own-hill{background:var(--own-hill)}
.swatch i.own-pine{background:var(--own-pine)} .swatch i.own-clay{background:var(--own-clay)}
.swatch i.own-ink{background:var(--own-ink)}
.terr{display:flex;justify-content:space-between;align-items:baseline;gap:1rem}
.terr b{font-size:1.3rem;font-variant-numeric:tabular-nums}

/* 국토 측량 */
.lbl{display:block;font-size:.78rem;letter-spacing:.14em;color:var(--ink-soft);margin-bottom:.45rem}
.fld{width:100%;padding:.85rem .9rem;border:1.5px solid var(--ink);border-radius:2px;background:transparent;color:inherit;font:inherit}
.fld::placeholder{color:var(--ink-faint)}
.ico{flex:0 0 auto;display:block;width:20px;height:20px}
.ico svg{display:block;width:100%;height:100%}
.ico.sm{width:18px;height:18px}
.sv{display:flex;gap:.8rem;align-items:flex-start;border:1px solid var(--rule);border-radius:2px;padding:.8rem .9rem}
.sv img{width:64px;height:64px;flex:0 0 auto;object-fit:cover;border:1px solid var(--rule);display:block}
.sv .b{flex:1 1 auto;min-width:0}
.sv .t{font-size:.95rem;line-height:1.55;overflow-wrap:anywhere;display:flex;gap:.45rem;align-items:flex-start}
.sv .t .ico{margin-top:.15rem}
.sv .w{font-size:.8rem;line-height:1.5;color:var(--river);margin-top:.3rem;overflow-wrap:anywhere}
.sv .m{font-size:.72rem;color:var(--ink-faint);margin-top:.35rem;font-variant-numeric:tabular-nums}
.sv .x{flex:0 0 auto;background:none;border:0;padding:.2rem 0 .2rem .4rem;font-size:.72rem;color:var(--ink-faint);text-decoration:underline;text-underline-offset:2px}
.sv .x[data-armed="1"]{color:var(--ink);font-weight:700}
.tally{display:grid;grid-template-columns:repeat(2,1fr);gap:.35rem .9rem;font-size:.84rem}
.tally div{display:flex;justify-content:space-between;gap:.6rem;border-bottom:1px dotted var(--rule);padding:.15rem 0}
.tally b{font-variant-numeric:tabular-nums}
.note{font-size:.8rem;line-height:1.65;color:var(--ink-soft)}
.diag{cursor:pointer;font-size:.78rem;letter-spacing:.04em;color:var(--ink-soft);padding:.2rem 0}
.diag.bad{color:var(--seal);font-weight:700}
.ck{list-style:none;margin:.5rem 0 .2rem;padding:0;font-size:.82rem;line-height:1.9}
.ck li{display:flex;justify-content:space-between;gap:.6rem;border-bottom:1px dotted var(--rule);padding:.1rem 0}
.foot{font-size:.72rem;color:var(--ink-faint);line-height:1.7;text-align:center}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
@media (prefers-reduced-motion:reduce){
  .stamp-wrap.drop{animation:fade .2s ease-out both}
  @keyframes fade{from{opacity:0}to{opacity:1}}
  .stage.shake{animation:none}
  .stamp.bleed{animation:none}
  .surveyor g{animation:none}
  .dots span{animation:none;opacity:.8}
}
</style>

/* ── 저장 ── */
const KEY = "udu.passport.v1";
function norm(p){
  p.entries = p.entries || []; p.exits = p.exits || [];
  p.survey = p.survey || [];   // 국토 측량 보고. 사진 본체는 IndexedDB
  p.steps = p.steps || {};     // { [칸id]: {n:밟은 날 수, first, last} } 영토
  p.color = p.color || "river";
  p.waits = p.waits || []; p.bestRank = p.bestRank || 0;
  p.done = p.done || {}; p.shots = p.shots || {}; p.nums = p.nums || {};
  p.geo = p.geo || {};       // { [missionId]: { [pointKey]: ISO } } 지점별 방문 기록
  p.timer = p.timer || null;
  return p;
}
function load(){ try{ const r = localStorage.getItem(KEY); return r ? norm(JSON.parse(r)) : null; }catch(e){ return null; } }
function save(p){ try{ localStorage.setItem(KEY, JSON.stringify(p)); }catch(e){} }

/* ── 사진 — 기기에만 저장한다. 서버로 보내지 않는다 ── */
let IDB = null;
function idb(){
  return new Promise(res => {
    if(IDB) return res(IDB);
    try{
      const q = indexedDB.open("udu", 1);
      q.onupgradeneeded = () => { try{ q.result.createObjectStore("shots"); }catch(e){} };
      q.onsuccess = () => { IDB = q.result; res(IDB); };
      q.onerror = () => res(null);
    }catch(e){ res(null); }
  });
}
function putShot(key, blob){
  return idb().then(d => d && new Promise(r => {
    try{ const t = d.transaction("shots","readwrite");
      t.objectStore("shots").put(blob, key);
      t.oncomplete = () => r(true); t.onerror = () => r(false);
    }catch(e){ r(false); }
  }));
}
function getShot(key){
  return idb().then(d => d && new Promise(r => {
    try{ const t = d.transaction("shots","readonly");
      const q = t.objectStore("shots").get(key);
      q.onsuccess = () => r(q.result || null); q.onerror = () => r(null);
    }catch(e){ r(null); }
  }));
}
function shrink(file, max){
  max = max || 480;
  return new Promise(res => {
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => {
      const s = Math.min(1, max/Math.max(img.width, img.height));
      const c = document.createElement("canvas");
      c.width = Math.max(1, Math.round(img.width*s));
      c.height = Math.max(1, Math.round(img.height*s));
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url);
      c.toBlob(b => res(b), "image/jpeg", .72);
    };
    img.onerror = () => { URL.revokeObjectURL(url); res(null); };
    img.src = url;
  });
}

/* 경계가 채워져 있고, 해당 과업의 좌표도 있어야 위치 인증이 열린다.
   인자 없이 부르면 국경 판정 가능 여부만 본다. */
function geoReady(m){
  if(!CFG.boundary) return false;
  if(!m) return true;
  const pts = m.points || (m.coord ? [{ coord:m.coord }] : []);
  return pts.some(pt => pt && pt.coord);

/* ISO 문자열을 그대로 자르면 UTC 날짜가 나와 한국 시간 오전 9시에 날이 갈린다.
   "같은 날"은 기기의 현지 날짜로 센다. */
function dayKey(iso){
  const d = new Date(iso);
  return isNaN(d) ? "" : `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
}
function distinctDays(list){
  const set = {};
  (list||[]).forEach(s => { if(s && s.at) set[dayKey(s.at)] = 1; });
  return Object.keys(set).length;
}
function mDone(m){
  const p = S.pp; if(!p) return false;
  switch(m.verify){
    case "auto":  return m.auto ? !!m.auto(p) : false;
    case "photo": {
      const l = p.shots[m.id] || [];
      return m.days ? distinctDays(l) >= (m.need||1) : l.length >= (m.need||1);
    }
    case "won":   return typeof p.nums[m.id] === "number";
    default:      return !!p.done[m.id];
  }
}
function doneCount(){ return MISSIONS.filter(mDone).length; }
function catList(c){ return MISSIONS.filter(m => m.cat === c); }

function el(tag, attrs, kids){
  const n = document.createElement(tag);
  if(attrs) for(const k in attrs){
    const v = attrs[k];
    if(v == null) continue;
    if(k === "class") n.className = v;
    else if(k === "html") n.innerHTML = v;
    else if(k === "text") n.textContent = v;
    else if(k.startsWith("on")) n.addEventListener(k.slice(2), v);
    else n.setAttribute(k, v);
  }
  (kids||[]).forEach(c => c && n.appendChild(c));
  return n;
}

/* ── 위치 ── 배포 환경에서는 실제 GPS, 아티팩트 뷰어에서는 거부되어 모의로 떨어진다 */
function locate(){
  return new Promise(res => {
    if(!navigator.geolocation) return res({ ok:false, code:"unsupported" });
    let done = false;
    const t = setTimeout(() => { if(!done){ done = true; res({ ok:false, code:"timeout" }); } }, 6000);
    try{
      navigator.geolocation.getCurrentPosition(
        p => { if(done) return; done = true; clearTimeout(t);
               res({ ok:true, lat:p.coords.latitude, lng:p.coords.longitude, acc:p.coords.accuracy }); },
        e => { if(done) return; done = true; clearTimeout(t);
               res({ ok:false, code: e && e.code === 1 ? "denied" : "unavailable" }); },
        { enableHighAccuracy:true, timeout:5500, maximumAge:30000 }
      );
    }catch(e){ if(!done){ done = true; clearTimeout(t); res({ ok:false, code:"unsupported" }); } }
  });
}

/* ─────────────────────────────────────────────────────────────
   지오펜스 판정

   아래 셋은 좌표 데이터와 무관한 순수 함수다. 답사 전에도 검증할 수 있고,
   모의 패널의 자가 진단이 이 셋을 직접 시험한다.
     distM        두 점 사이 거리 (haversine)
     inPoly       점-다각형 (ray casting, 감김 방향 무관, 오목 다각형 가능)
     distToEdgeM  다각형 변까지 최단 거리

   그 아래 넷은 CFG 를 읽는다. CFG.boundary 가 null 이면 null 을 돌려주고,
   호출하는 쪽은 그것을 "판정 불가"로 읽어 모의 모드로 떨어진다.
   false(판정 결과 밖)와 null(판정할 데이터가 없음)을 섞지 않는다.
   ───────────────────────────────────────────────────────────── */
const R_EARTH = 6371000;
const M_PER_DEG = 111320;            // 위도 1도. 경도는 cos(위도)를 곱한다

function distM(aLat, aLng, bLat, bLng){
  const rad = Math.PI/180;
  const dLat = (bLat-aLat)*rad, dLng = (bLng-aLng)*rad;
  const h = Math.sin(dLat/2)**2
          + Math.cos(aLat*rad)*Math.cos(bLat*rad)*Math.sin(dLng/2)**2;
  return 2*R_EARTH*Math.asin(Math.min(1, Math.sqrt(h)));
}

function inPoly(lat, lng, poly){
  if(!poly || poly.length < 3) return false;
  let hit = false;
  for(let i=0, j=poly.length-1; i<poly.length; j=i++){
    const yi = poly[i][0], xi = poly[i][1];
    const yj = poly[j][0], xj = poly[j][1];
    if((yi > lat) !== (yj > lat) &&
       lng < (xj-xi)*(lat-yi)/(yj-yi) + xi) hit = !hit;
  }
  return hit;
}

/* 동 하나 크기에서는 평면으로 근사해도 오차가 1m 미만이다.
   변마다 haversine 을 도는 대신 미터 좌표로 눕히고 점-선분 거리를 쓴다. */
function distToEdgeM(lat, lng, poly){
  if(!poly || poly.length < 2) return Infinity;
  const mLng = M_PER_DEG*Math.cos(lat*Math.PI/180);
  const px = lng*mLng, py = lat*M_PER_DEG;
  let best = Infinity;
  for(let i=0, j=poly.length-1; i<poly.length; j=i++){
    const ax = poly[j][1]*mLng, ay = poly[j][0]*M_PER_DEG;
    const bx = poly[i][1]*mLng, by = poly[i][0]*M_PER_DEG;
    const dx = bx-ax, dy = by-ay;
    const len2 = dx*dx + dy*dy;
    let t = len2 ? ((px-ax)*dx + (py-ay)*dy)/len2 : 0;
    t = t < 0 ? 0 : t > 1 ? 1 : t;
    best = Math.min(best, Math.hypot(px-(ax+t*dx), py-(ay+t*dy)));
  }
  return best;
}

/* 영토 안인가. 경계 밖이어도 bufferM 안이면 통과시킨다 — 관대하게 */
function inside(lat, lng){
  if(!CFG.boundary) return null;
  if(inPoly(lat, lng, CFG.boundary)) return true;
  return distToEdgeM(lat, lng, CFG.boundary) <= CFG.bufferM;
}

/* 경계까지 거리. 안에 있으면 0 */
function borderDistM(lat, lng){
  if(!CFG.boundary) return null;
  if(inPoly(lat, lng, CFG.boundary)) return 0;
  return Math.round(distToEdgeM(lat, lng, CFG.boundary));
}

/* 금지 구역 안인가 — 엄격하게. 측위 오차만큼 반경을 불린다.
   오차 원이 구역에 닿기만 해도 도장을 주지 않는다 (헌법 제12조).
   구역을 찾으면 그 객체를 돌려준다. 단지명은 화면에 쓰지 않고 reason 만 쓴다. */
function nearExcluded(lat, lng, accM){
  const pad = accM > 0 ? accM : 0;
  for(const z of (CFG.excluded||[])){
    if(!z || !z.center) continue;
    if(distM(lat, lng, z.center[0], z.center[1]) <= (z.radiusM||0) + pad) return z;
  }
  return null;
}

/* 미션 지점 안인가. m.coord 단일 또는 m.points 배열을 받는다.
   { ok, m, point } — point 는 판정에 쓰인 지점(배열일 때 가장 가까운 것) */
function nearPoint(lat, lng, m){
  const pts = m && m.points ? m.points
            : m && m.coord  ? [{ key:"main", name:null, coord:m.coord, radiusM:m.radiusM }]
            : null;
  if(!pts) return null;
  let best = null;
  for(const pt of pts){
    if(!pt || !pt.coord) continue;
    const d = distM(lat, lng, pt.coord[0], pt.coord[1]);
    if(!best || d < best.m) best = { ok: d <= (pt.radiusM || 30), m: Math.round(d), point: pt };
  }
  return best;                        // 좌표가 하나도 없으면 null
}

/* 가장 가까운 다리. 통과 지점 표기에 쓴다 */
function nearestBridge(lat, lng){
  let best = null;
  for(const b of (CFG.bridges||[])){
    if(!b || !b.end) continue;
    const d = distM(lat, lng, b.end[0], b.end[1]);
    if(!best || d < best.m) best = { name:b.name, m:Math.round(d), bridge:b };
  }
  return best;
}

/* ─────────────────────────────────────────────────────────────
   격자와 영토

   도면은 territory 폴리곤 위에 cellM 격자를 깐다. 칸의 중심이 영토 안이면
   그 칸은 국토다. 격자 원점은 폴리곤의 남서쪽 모서리 — 같은 좌표면 늘 같은 칸이 나온다.

   점령 규칙은 둘로 나뉜다.
     첫 발   개척. 한 번뿐이고, 그 칸이 열린다
     반복   점유. 하루에 한 번만 세고, holdDays 만큼 쌓이면 칸이 꽉 찬다
   반복을 그대로 점령으로 치면 늘 가던 데만 가는 게 최적이 된다. 그래서 넓히는 건
   첫 발이고 반복은 지키는 힘이다. 남이 들어오면 지키는 힘이 쓰일 자리가 생긴다.
   ───────────────────────────────────────────────────────────── */
let _grid = null;
function grid(){
  if(_grid !== null) return _grid;
  const T = CFG.territory;
  if(!T || T.length < 3) return (_grid = false);
  let la0=Infinity, la1=-Infinity, ln0=Infinity, ln1=-Infinity;
  T.forEach(p => { la0=Math.min(la0,p[0]); la1=Math.max(la1,p[0]);
                   ln0=Math.min(ln0,p[1]); ln1=Math.max(ln1,p[1]); });
  const mLat = M_PER_DEG, mLng = M_PER_DEG*Math.cos((la0+la1)/2*Math.PI/180);
  const dLat = CFG.cellM/mLat, dLng = CFG.cellM/mLng;
  const rows = Math.ceil((la1-la0)/dLat), cols = Math.ceil((ln1-ln0)/dLng);
  const cells = [], has = {};
  for(let r=0;r<rows;r++) for(let c=0;c<cols;c++){
    const lat = la0 + (r+0.5)*dLat, lng = ln0 + (c+0.5)*dLng;
    if(inPoly(lat,lng,T)){ const id = r+","+c; cells.push({ id,r,c,lat,lng }); has[id]=1; }
  }
  return (_grid = { la0,la1,ln0,ln1, mLat,mLng, dLat,dLng, rows,cols, cells, has });
}
/* 좌표가 속한 칸. 영토 밖이면 null.
   칸은 "중심이 영토 안"일 때만 국토로 친다. 그러면 강을 따라 난 가장자리에
   중심은 물 위인데 땅은 밟을 수 있는 자리가 생긴다 — 영토의 4.6% 가 그랬다.
   둑길이 대부분 거기다. 그래서 영토 안인데 칸이 없으면 가장 가까운 칸으로 붙인다. */
function cellAt(lat,lng){
  const g = grid();
  if(!g) return null;
  const r = Math.floor((lat-g.la0)/g.dLat), c = Math.floor((lng-g.ln0)/g.dLng);
  const id = r+","+c;
  if(g.has[id]) return { id,r,c };
  if(!inPoly(lat,lng,CFG.territory)) return null;
  let best = null;
  g.cells.forEach(x => {
    const d = distM(lat,lng,x.lat,x.lng);
    if(!best || d < best.d) best = { id:x.id, r:x.r, c:x.c, d };
  });
  return best ? { id:best.id, r:best.r, c:best.c, snapped:true } : null;
}
/* 그 칸을 며칠 밟았나 / 얼마나 찼나 */
function held(p,id){ const s = (p && p.steps && p.steps[id]) || null; return s ? s.n : 0; }
function fillOf(p,id){ return Math.min(1, held(p,id)/Math.max(1,CFG.holdDays)); }
function terrStat(p){
  const g = grid();
  if(!g) return { total:0, opened:0, full:0 };
  let opened=0, full=0;
  g.cells.forEach(c => { const n = held(p,c.id); if(n>0) opened++; if(n>=CFG.holdDays) full++; });
  return { total:g.cells.length, opened, full };
}

/* ─────────────────────────────────────────────────────────────
   자가 진단 — 답사 전에 판정 수학을 시험한다.

   좌표 데이터가 없어도 ray casting 과 거리 계산은 지금 검증할 수 있다.
   CFG 를 읽는 함수들은 시험 도형으로 잠깐 바꿔 실제 호출 경로를 지나간다.
   결과는 모의 패널 맨 아래. 답사에서 CFG 를 채운 뒤에도 한 번 더 보면 된다.
   ───────────────────────────────────────────────────────────── */
const GEO_FIX = {
  /* 사각형 — 위도 37.900~37.910, 경도 127.720~127.730 */
  sq: [[37.900,127.720],[37.910,127.720],[37.910,127.730],[37.900,127.730]],
  /* ㄱ자 — 오른쪽 위가 파여 있다. 우두동 경계도 오목할 것이므로 이쪽이 본 시험이다 */
  ell:[[37.900,127.720],[37.910,127.720],[37.910,127.725],
       [37.905,127.725],[37.905,127.730],[37.900,127.730]]
};

function geoSelfTest(){

  /* CFG 를 읽는 함수들 — 시험 도형으로 바꿔 끼운다 */

  try{

                    { id:"b", name:"나교", end:[37.9100,127.7250] }];

    add("완충 · 경계 밖 28m 는 통과 (bufferM 50)", inside(37.91025,127.725) === true);
    add("완충 · 경계 밖 78m 는 거부",              inside(37.9107,127.725) === false);
    add("거리 표기 · 영토 안이면 0m",              borderDistM(37.905,127.725) === 0);
    const far = borderDistM(37.920,127.725);
    add("거리 표기 · 밖이면 실제 거리",            near(far, 1113, 12), `${far}m`);

    add("금지 구역 · 반경 56m 지점은 거부",        !!nearExcluded(37.9055,127.7250, 0));
    add("금지 구역 · 반경 111m 지점은 통과",       nearExcluded(37.9060,127.7250, 0) === null);
    add("금지 구역 · 측위 오차만큼 엄격해진다",     !!nearExcluded(37.9060,127.7250, 30));
    add("다리 · 가까운 쪽을 고른다",

  }
  add("판정 불가 · 경계가 비어 있으면 null", inside(37.905,127.725) === null);

  const mTwo = { id:99, sameDay:true, points:[

  add("과업 지점 · 여러 지점 중 가까운 쪽",

  add("같은 날 · 날이 다르면 미충족",
      geoSatisfied(mTwo, { geo:{ 99:{ a:t9, b:t10 } } }) === false);
  add("같은 날 · 한 지점만이면 미충족",

/* ─────────────────────────────────────────────────────────────
   해 질 무렵

   우두벌 일몰은 세계관의 중심 시각이고(과업 11), 측량에서 가장 자주 적히는
   조건이기도 하다. 외부 스크립트를 쓰지 않는 앱이므로 직접 센다.
   NOAA 간이식 — 분 단위 오차면 충분하다. 극지에서는 null 을 돌려준다.
   ───────────────────────────────────────────────────────────── */
function sunsetAt(lat, lng, date){
  const rad = Math.PI/180, J1970 = 2440588, J2000 = 2451545, dayMs = 86400000;
  const lw = rad * -lng, phi = rad * lat;
  const d = date.valueOf()/dayMs - 0.5 + J1970 - J2000;
  const n = Math.round(d - 0.0009 - lw/(2*Math.PI));
  const ds = 0.0009 + lw/(2*Math.PI) + n;
  const M = rad * (357.5291 + 0.98560028*ds);
  const C = rad * (1.9148*Math.sin(M) + 0.02*Math.sin(2*M) + 0.0003*Math.sin(3*M));
  const L = M + C + rad*102.9372 + Math.PI;
  const dec = Math.asin(Math.sin(rad*23.4397) * Math.sin(L));
  const cosW = (Math.sin(rad*-0.833) - Math.sin(phi)*Math.sin(dec)) / (Math.cos(phi)*Math.cos(dec));
  if(!(cosW >= -1 && cosW <= 1)) return null;          // 백야 · 극야
  const a = 0.0009 + (Math.acos(cosW) + lw)/(2*Math.PI) + n;
  const Jset = J2000 + a + 0.0053*Math.sin(M) - 0.0069*Math.sin(2*L);
  return new Date((Jset + 0.5 - J1970) * dayMs);
}
const hhmm = d => `${pad(d.getHours())}:${pad(d.getMinutes())}`;

/* 일몰을 셀 기준점. 경계가 있으면 그 중심, 없으면 내가 측량한 지점들의 평균.
   둘 다 없으면 null — 없는 좌표를 지어내지 않는다 (일몰 줄이 그냥 안 뜬다). */
function sunRef(){
  if(CFG.boundary && CFG.boundary.length){
    let a = 0, b = 0;
    CFG.boundary.forEach(p => { a += p[0]; b += p[1]; });
    return [a/CFG.boundary.length, b/CFG.boundary.length];
  }
  const l = ((S.pp && S.pp.survey) || []).filter(s => s.coord);
  if(!l.length) return null;
  let a = 0, b = 0;
  l.forEach(s => { a += s.coord[0]; b += s.coord[1]; });
  return [a/l.length, b/l.length];
}

/* ── 지금 ──
   조건을 적어 둔 보고를 그때와 같은 시각에 다시 올린다.
   조건을 받아만 두고 쓰지 않으면 적을 이유가 없다. 돌아올 이유는 이것뿐이다.

   규칙은 한 줄이다.
     그때가 일몰 전후였으면 → 오늘 일몰 전후에 올린다
     아니면                → 시계로 ±1시간에 올린다
   일몰 기준이 없으면(좌표 없음) 시계만 쓴다. 조건을 적지 않은 보고는 올리지 않는다. */
const DUSK_M = 40, CLOCK_M = 60;
function nowMatches(){
  const p = S.pp;
  const ref = sunRef(), n = now();
  const todaySet = ref ? sunsetAt(ref[0], ref[1], n) : null;
  const nowOff = todaySet ? (n - todaySet)/60000 : null;
  const list = [];
  ((p && p.survey) || []).forEach(s => {
    if(!s.when) return;                                 // 조건을 적은 것만
    const d = new Date(s.at);
    if(todaySet != null && Math.abs(nowOff) <= DUSK_M && s.coord){
      const was = sunsetAt(s.coord[0], s.coord[1], d);
      if(was && Math.abs((d - was)/60000) <= DUSK_M){ list.push({ s, why:"해 질 무렵" }); return; }
    }
    const gap = Math.abs((n.getHours()*60 + n.getMinutes()) - (d.getHours()*60 + d.getMinutes()));
    if(Math.min(gap, 1440-gap) <= CLOCK_M) list.push({ s, why:`${pad(d.getHours())}시쯤` });
  });
  return { list, sunset: todaySet };
}

/* ─────────────────────────────────────────────────────────────
   도면

   타일을 깔지 않는다. 위성사진이 박히는 순간 이 앱은 평범한 지도앱이 되고,
   외부 스크립트를 쓰지 않는다는 원칙도 깨진다. 강과 격자와 점만 직접 그린다.
   그러면 지도가 아니라 측량도면이 된다 — 국민증 다음 첫 화면으로 그게 맞다.

   좌표는 미터로 눕혀 그린다. 선 굵기도 미터라 확대·축소에 상관없이 비율이 같다.
   북쪽 한 변만 파선이다. 거기만 강이 아니라 내가 그은 선이기 때문이다.
   ───────────────────────────────────────────────────────────── */
function planSVG(p, hereCell){
  /* "지금 선 칸" 표시는 오늘 것만 쓴다. 어제 밟은 자리를 지금 서 있는 것처럼 보이면 안 된다 */
  const today = dayKey(new Date().toISOString());
  const here = hereCell && hereCell.day === today ? hereCell : null;
  const g = grid();
  if(!g) return el("p",{ class:"note", text:"도면을 그릴 경계가 없습니다." });
  const X = ln => (ln - g.ln0) * g.mLng;
  const Y = la => (g.la1 - la) * g.mLat;
  const W = Math.round((g.ln1-g.ln0)*g.mLng), H = Math.round((g.la1-g.la0)*g.mLat);
  const PAD = 90;
  const own = colorOf(p);
  const n = v => Math.round(v*10)/10;

  const T = CFG.territory;
  const ring = T.map(q => `${n(X(q[1]))},${n(Y(q[0]))}`).join(" ");
  /* 북쪽 선 — 위도가 가장 높은 변. 강이 아니므로 파선으로 구분해 그린다 */
  const north = T.filter(q => q[0] >= g.la1 - 1e-9).sort((a,b)=>a[1]-b[1]);

  const parts = [];
  /* 땅 모양으로 오려낸다. 격자와 칸이 영토 밖으로 새면 그 순간 도면이 아니라 표가 된다 */
  parts.push(`<defs><clipPath id="landClip"><polygon points="${ring}"/></clipPath></defs>`);
  parts.push(`<polygon class="land" points="${ring}"/>`);

  const cw = n(g.dLng*g.mLng), ch = n(g.dLat*g.mLat);
  const inner = [];
  /* 칸 — 아래에서 차오른다. "로딩칸"이므로 높이가 늘어야지 흐림이 바뀌면 안 된다 */
  g.cells.forEach(c => {
    const f = fillOf(p, c.id);
    if(f <= 0) return;
    const x = n(X(g.ln0 + c.c*g.dLng)), yTop = n(Y(g.la0 + (c.r+1)*g.dLat));
    const done = f >= 1;
    /* 찬 만큼만 칠하면 칸마다 막대가 따로 서서 막대그래프로 보인다.
       밟은 칸 전체에 옅은 바탕을 깔아야 "차고 있는 한 칸"으로 읽힌다 */
    if(!done) inner.push(`<rect class="own own-${own}" x="${x}" y="${yTop}"
      width="${cw}" height="${ch}" fill="currentColor" opacity=".1"/>`);
    inner.push(`<rect class="own own-${own}" x="${x}" y="${n(yTop + ch*(1-f))}"
      width="${cw}" height="${n(ch*f)}" fill="currentColor" opacity="${done ? .6 : .36}"/>`);
  });
  /* 괘선 — 칸마다 네모가 아니라 가로세로로 길게 긋고 땅 모양으로 자른다 */
  for(let r=0;r<=g.rows;r++){
    const y = n(Y(g.la0 + r*g.dLat));
    inner.push(`<line class="gl" x1="${n(X(g.ln0))}" y1="${y}" x2="${n(X(g.ln1))}" y2="${y}"/>`);
  }
  for(let c=0;c<=g.cols;c++){
    const x = n(X(g.ln0 + c*g.dLng));
    inner.push(`<line class="gl" x1="${x}" y1="${n(Y(g.la0))}" x2="${x}" y2="${n(Y(g.la1))}"/>`);
  }
  parts.push(`<g clip-path="url(#landClip)">${inner.join("\n")}</g>`);

  parts.push(`<polygon class="edge" points="${ring}"/>`);   /* polyline 이면 합수머리 쪽이 안 닫힌다 */
  if(north.length >= 2)
    parts.push(`<line class="edge drawn" x1="${n(X(north[0][1]))}" y1="${n(Y(north[0][0]))}"
                 x2="${n(X(north[north.length-1][1]))}" y2="${n(Y(north[north.length-1][0]))}"/>`);

  /* 알려진 장소 — 작은 점. 내 측량점 — 빈 동그라미 */
  SEED.forEach(s => parts.push(`<circle class="seed" cx="${n(X(s.c[1]))}" cy="${n(Y(s.c[0]))}" r="26"/>`));
  ((p && p.survey) || []).forEach(s => { if(!s.coord) return;
    parts.push(`<circle class="mine" cx="${n(X(s.coord[1]))}" cy="${n(Y(s.coord[0]))}" r="40"/>`); });
  if(here){
    const c = g.cells.filter(x => x.id === here.id)[0];
    if(c) parts.push(`<rect class="here" x="${n(X(g.ln0 + c.c*g.dLng))+14}"
      y="${n(Y(g.la0 + (c.r+1)*g.dLat))+14}" width="${cw-28}" height="${ch-28}"/>`);
  }

  const st = terrStat(p);
  const box = el("div",{ class:"plan" });
  box.innerHTML =
    `<svg viewBox="${-PAD} ${-PAD} ${W+PAD*2} ${H+PAD*2}" role="img"
       aria-label="우두국 국토 도면. 두 강으로 둘린 영토에 ${st.total}칸 격자가 깔려 있고 ${st.opened}칸을 밟았습니다.">
       ${parts.join("\n")}
     </svg>
     <div class="north" aria-hidden="true">
       <svg viewBox="0 0 12 18" fill="none" stroke="currentColor" stroke-width="1.1">
         <path d="M6 17V3"/><path d="M2.6 6.4L6 2L9.4 6.4"/></svg>북</div>`;
  box.appendChild(el("dl",{ class:"title-blk" },[
    el("dt",{ text:"축척" }),   el("dd",{ text:`한 칸 ${CFG.cellM}m` }),
    el("dt",{ text:"작성" }),   el("dd",{ text:dateStr(now()) }),
    el("dt",{ class:"who", text:"측량자" }), el("dd",{ class:"who", text: p ? p.no : "—" })
  ]));
  return box;
}

/* ── 환율 — 시간본위제 ── */
function gak(){
  const obs = (S.pp && S.pp.waits || []).concat(CFG.rate.seedObservations).filter(n => typeof n === "number");
  if(!obs.length) return { min: CFG.rate.officialMinPerGak, seeded:false };
  const s = obs.slice().sort((a,b) => a-b);
  const mid = s.length % 2 ? s[(s.length-1)/2] : Math.round((s[s.length/2-1]+s[s.length/2])/2);
  return { min: Math.max(1, mid), seeded:true };
}

/* ── 여권 ── */
function issue(origin){
  const d = now();
  return norm({
    no: `UDU-${d.getFullYear()}-${pad(Math.floor(Math.random()*9000)+1000,4)}`,
    origin, issued: d.toISOString(),
    founding: true             // 제1기 국경 통과자 — 소양8교 개통 전
  });
}
const ROM = {
  "우두동":"UDU",
  "효자동":"HYOJA","석사동":"SEOKSA","퇴계동":"TOEGYE","후평동":"HUPYEONG",
  "소양동":"SOYANG","감자국 (춘천 시내)":"GAMJAGUK","국외":"FOREIGN"
};
const ROM_VISA = {
  "단기관광비자":"TOURIST","관광비자":"TOURIST","체류비자":"RESIDENT",
  "외교관 여권":"DIPLOMAT","월경자":"WOLGYEONGJA","미발급":"NONE",
  "국민":"NATIONAL"
};
function mrz(pp){
  const nat = isNational(pp);
  const base = ROM[pp.origin] || "SOMEORIGOL";
  const vis = ROM_VISA[currentVisa(pp).name] || "VISITOR";
  const l1 = ((nat ? "I<UDU" : "P<UDU") + base + "<<" + vis).padEnd(40,"<").slice(0,40);
  const n = nat ? pp.survey.length : pp.entries.length;
  const l2 = (pp.no.replace(/-/g,"") + "<2UDU").padEnd(38,"<").slice(0,38) + pad(n);
  return l1 + "\n" + l2;
}

/* 국민인가 — 우두동 출신은 국경을 건너지 않는다.
   그래서 비자 등급이 성립하지 않고, 여권 대신 국민증을 받는다.
   (설정집 §비자 등급은 "어떻게 들어왔나"를 묻는 체계라 국민에게는 질문 자체가 없다) */
function isNational(pp){ return !!pp && pp.origin === HOME; }

/* 신분증 이름. "여권"이 화면 곳곳에 박혀 있으면 국민에게 전부 어긋난다 */
function idName(pp){ return isNational(pp || S.pp) ? "국민증" : "여권"; }

/* 측량할 수 있는가 — 국민은 바로, 방문자는 입국한 뒤에.
   들어오지 않은 나라의 국토를 재지는 않는다 */
function canSurvey(pp){ return !!pp && (isNational(pp) || pp.entries.length > 0); }

function currentVisa(pp){
  if(isNational(pp)) return { visa:"—", name:"국민" };
  if(!pp || !pp.entries.length) return { visa:"—", name:"미발급" };
  const best = ROUTES.filter(r => r.rank === pp.bestRank)[0];
  return best ? { visa:best.visa, name:best.name } : { visa:"3급", name:"단기관광비자" };
}
const lastOf = a => (a && a.length ? a[a.length-1] : null);

/* 체류 중인가 — 마지막 입국 뒤에 출국이 없으면 체류 중이다.
   출국 도장은 체류 중인 여권에만 발급한다. 재입국은 몇 번이든 된다. */
function staying(pp){
  if(!pp || !pp.entries.length) return false;
  const lastIn = lastOf(pp.entries);
  const lastOut = lastOf(pp.exits);
  return !lastOut || new Date(lastOut.at) < new Date(lastIn.at);
}
/* 섭취국량 — 국을 먹은 과업(5·6)에 올린 사진 수. 커피(7)는 국이 아니다 */
function soupCount(pp){
  const s = (pp && pp.shots) || {};
  return ((s[5]||[]).length + (s[6]||[]).length);
}
/* 체류 시간. 하루를 넘기면 일로 센다 — "72시간 0분"은 공문이 아니라 고장난 숫자로 읽힌다.
   0으로 끝나는 꼬리는 떼어낸다 ("1시간 0분" → "1시간") */
function stayStr(min){
  const m = Math.max(1, Math.round(min||0));
  if(m < 60) return `${m}분`;
  const h = Math.floor(m/60);
  if(h < 24) return m%60 ? `${h}시간 ${m%60}분` : `${h}시간`;
  const d = Math.floor(h/24);
  return h%24 ? `${d}일 ${h%24}시간` : `${d}일`;
}

/* 마지막 실제 측량의 국경까지 거리. 화면설계 S5 — 국경 밖이면 버튼이 거리를 알려준다.
   여권 홈에서 위치를 다시 읽지는 않는다. 앱을 열자마자 권한 창을 띄우지 않기 위해서다.
   그래서 심사를 한 번 거친 뒤에만, 그것도 10분 동안만 표시한다. */
function borderHint(){
  const f = S.lastFix;
  if(!f || !f.m || Date.now() - f.at > 10*60*1000) return null;
  return f.m >= 1000 ? `${(f.m/1000).toFixed(1)}km` : `${f.m}m`;
}

    el("div",{ class:"stamp-sub", text: sub || (kind === "survey" ? "국토" : "소양2교") })
  ]));
  /* 측량 도장에만 붙는 등록 표식. 삼각점·눈금자도 받았지만 270px 에서 글자와 싸워 뺐다 */
  if(kind === "survey") s.insertAdjacentHTML("beforeend",
    `<svg class="stamp-reg" viewBox="0 0 300 200" fill="none" stroke="currentColor"
       stroke-width="2.4" stroke-linecap="square" aria-hidden="true">
       <path d="M26 44V26H44"/><path d="M256 26H274V44"/>
       <path d="M26 156V174H44"/><path d="M256 174H274V156"/></svg>`);
  return s;
}

/* 도장 낙하 — 180ms 접촉에서 소리·진동·텍스트 3중으로 알린다.
   시각 연출에만 의존하지 않는다. 입국과 출국이 같이 쓴다. */
function dropStamp(msg){
  const wrap = document.getElementById("swrap");
  const stamp = document.getElementById("stamp");
  const stage = document.getElementById("stage");
  if(wrap) wrap.classList.add("drop");
  setTimeout(() => {
    thunk(); buzz();
    if(stage) stage.classList.add("shake");
    if(stamp) stamp.classList.add("bleed");
    say(msg);
  }, 180);
}

/* 심사 진행 */
function startControl(){
  audio();                                   // 사용자 제스처 안에서 오디오 잠금 해제
  S.ctl = { phase:"locating", date: now(), purpose:null, route:null, wait:null };
  go("control");
  runControl();
}
async function runControl(){
  const c = S.ctl;
  say("국경 위치를 확인하고 있습니다.");

  const [res] = await Promise.all([ locate(), sleep(1500) ]);   // 최소 1.5초
  const sim = S.sim ? S.simCase : null;

  if(sim === "hours" || !withinHours(c.date)){
    return fail("심사 시간이 아닙니다.",
      "국경 심사는 07시부터 21시까지 진행됩니다. 헌법 제11조에 따라, 밤에는 국민이 잠듭니다.");
  }
  if(sim === "denied" || (!S.sim && !res.ok && res.code === "denied")){
    return fail("위치 확인이 거부되었습니다.",
      "국경 심사는 위치 확인 없이 진행할 수 없습니다. 헌법 제4조에 따라, 다리를 건넌 사실만이 입국을 증명합니다.");
  }
  if(!S.sim && !res.ok){
    return fail("국경 측량에 실패했습니다.", "잠시 후 다시 신고하십시오.");
  }

  /* ── 실제 판정 ── 모의 모드에서는 위 분기가 대신한다.
     순서가 규칙이다. 금지 구역이 국경보다 먼저다. 애매하면 도장을 주지 않는다. */
  if(!S.sim){
    if(res.acc > CFG.maxAccM){
      return fail("측량 정밀도가 부족합니다.",
        `오차가 약 ${Math.round(res.acc)}m 입니다. 국경 심사는 이 정밀도로 진행하지 않습니다. 하늘이 보이는 곳에서 다시 신고하십시오.`);
    }
    const zone = nearExcluded(res.lat, res.lng, res.acc || 0);
    if(zone) return fail("해당 구역에서는 도장을 발급하지 않습니다.", forbidBody(zone));

    const ins = inside(res.lat, res.lng);
    /* null 은 "밖"이 아니라 "판정할 데이터가 없음"이다. 둘을 같은 문구로 덮지 않는다 */
    if(ins === null){
      return fail("국경을 판정할 수 없습니다.",
        "국경 좌표가 등록되지 않았습니다. 우두국은 확인되지 않은 통과를 기록하지 않습니다.");
    }
    S.lastFix = { m: borderDistM(res.lat, res.lng), at: Date.now() };
    if(ins === false){
      const br = nearestBridge(res.lat, res.lng);
      return fail("귀하는 현재 우두국 영토 밖에 있습니다.",
        `국경까지 약 ${S.lastFix.m}m 남았습니다. 국경을 넘은 뒤 다시 신고하십시오.`
        + (br ? ` 가장 가까운 검문소는 ${br.name}입니다.` : ""));
    }
  }
  if(sim === "out"){
    return fail("귀하는 현재 우두국 영토 밖에 있습니다.",
      "국경을 넘은 뒤 다시 신고하십시오. 가장 가까운 검문소는 소양2교입니다.");
  }
  if(sim === "forbid"){
    return fail("해당 구역에서는 도장을 발급하지 않습니다.", forbidBody(null));
  }

  c.coord = res.ok ? `${res.lat.toFixed(6)}, ${res.lng.toFixed(6)}`
                   : "좌표 미확인 · 모의 측량";
  const br = res.ok && !S.sim ? nearestBridge(res.lat, res.lng) : null;
  c.place = br ? `${br.name} 통과 확인` : "소양2교 통과 확인";
  c.phase = "verdict"; render();
  say(c.place);

  await sleep(1500);
  c.phase = "q1"; render();
}
function fail(title, body){ return failOn(S.ctl, title, body); }
function failOn(c, title, body){
  c.phase = "fail"; c.failTitle = title; c.failBody = body;
  render(); say(title + " " + body);
}
function say(t){
  const n = document.getElementById("live");
  if(n) n.textContent = t;
}

async function submit(){
  const c = S.ctl;
  c.phase = "processing"; render();
  say("심사 중입니다.");
  await sleep(1200);                          // 고정 지연 — 즉시 통과시키면 도장이 싸진다

  c.phase = "stamp"; render();
  dropStamp(`입국 도장이 발급되었습니다. ${c.route.visa} ${c.route.name}.`);

  await sleep(3000);                           // 도장 3초

  const e = {
    at: c.date.toISOString(), route: c.route.id,
    visa: c.route.visa, name: c.route.name, purpose: c.purpose,
    wait: c.wait ? c.wait.min : null
  };
  S.pp.entries.push(e);
  if(c.wait && c.wait.min != null) S.pp.waits.push(c.wait.min);
  S.pp.bestRank = Math.max(S.pp.bestRank || 0, c.route.rank);
  save(S.pp);
  S.lastEntry = e;

  c.phase = "approved"; render();
}

/* ─────────────────────────────────────────────────────────────
   S6 — 출국 심사. 입국의 거울.

   연출은 입국의 구조를 쓰되 질문과 "심사 중" 지연을 뺐다. 나가는 사람에게
   신고받을 것이 없고, 화면설계 S6 이 전체를 약 4초로 정했다.
     위치 확인 1.5초 → 출국 도장 3초 → 체류 리포트 → 공유

   판정은 입국과 같은 순서를 지나간다. 영토 판정만 뒤집힌다.
     1 심사 시간 (헌법 제11조)
     2 위치 권한 거부 / 측량 실패
     3 측위 정밀도 (maxAccM)
     4 금지 구역 (헌법 제12조) — 국경보다 먼저 본다
     5 영토 판정 — 입국은 "안에 있어야", 출국은 "밖에 있어야" 통과

   왜 다리와의 거리로 판정하지 않는가.
   우두동은 두 강으로 둘린 땅이라 영토를 벗어났다는 사실 자체가 다리를
   건넜다는 뜻이다. nearestBridge 로 판정하면 다리까지 걸어갔다 되돌아선
   사람에게도 도장이 나간다. 그래서 다리는 README 가 적어둔 대로 통과
   지점 표기에만 쓴다.

   완충(bufferM)은 방향만 뒤집힌 채 그대로 쓰인다. 입국의 "경계 밖 50m
   까지는 안으로 봐준다"가 출국에서는 "경계 밖 50m 까지는 아직 나가지
   않은 것으로 본다"가 된다. 애매한 띠를 미발급 쪽으로 넘기는 한 줄이
   두 방향 모두에서 맞다 — inside() 하나로 끝난다.

   대신 국경에서 exitBandM 밖이면 받지 않는다. 집에 돌아가 누른 출국은
   다리를 건너며 받은 도장이 아니다.
   ───────────────────────────────────────────────────────────── */
function startExit(){
  audio();                                   // 사용자 제스처 안에서 오디오 잠금 해제
  S.ex = { phase:"locating", date: now() };
  go("exit");
  runExit();
}
async function runExit(){
  const c = S.ex;

  /* 여권 조건이 먼저다. 측위와 무관하므로 측량을 기다리지 않는다 */
  if(!staying(S.pp)){
    return failOn(c, "체류 중인 입국 기록이 없습니다.",
      "출국 심사는 입국한 여권에만 진행됩니다. 먼저 입국 심사를 받으십시오.");
  }

  say("국경 통과를 확인하고 있습니다.");
  const [res] = await Promise.all([ locate(), sleep(1500) ]);   // 최소 1.5초
  const sim = S.sim ? S.simCase : null;

  if(sim === "hours" || !withinHours(c.date)){
    return failOn(c, "심사 시간이 아닙니다.",
      "국경 심사는 07시부터 21시까지 진행됩니다. 헌법 제11조에 따라, 밤에는 국민이 잠듭니다. "
      + "체류 기록은 유지되므로 다음 심사 시간에 다시 신고하시면 됩니다.");
  }
  if(sim === "denied" || (!S.sim && !res.ok && res.code === "denied")){
    return failOn(c, "위치 확인이 거부되었습니다.",
      "출국 심사는 위치 확인 없이 진행할 수 없습니다. 헌법 제4조에 따라, 다리를 건넌 사실만이 국경 통과를 증명합니다.");
  }
  if(!S.sim && !res.ok){
    return failOn(c, "국경 측량에 실패했습니다.", "잠시 후 다시 신고하십시오.");
  }

  /* ── 실제 판정 ── 모의 모드에서는 위아래 분기가 대신한다 */
  if(!S.sim){
    if(res.acc > CFG.maxAccM){
      return failOn(c, "측량 정밀도가 부족합니다.",
        `오차가 약 ${Math.round(res.acc)}m 입니다. 출국 심사는 이 정밀도로 진행하지 않습니다. 하늘이 보이는 곳에서 다시 신고하십시오.`);
    }
    const zone = nearExcluded(res.lat, res.lng, res.acc || 0);
    if(zone) return failOn(c, "해당 구역에서는 도장을 발급하지 않습니다.", forbidBody(zone));

    /* 반전. 다만 null 은 "밖"이 아니라 "판정할 데이터가 없음"이다 — 문구를 섞지 않는다 */
    const ins = inside(res.lat, res.lng);
    if(ins === null){
      return failOn(c, "국경을 판정할 수 없습니다.",
        "국경 좌표가 등록되지 않았습니다. 우두국은 확인되지 않은 통과를 기록하지 않습니다.");
    }
    const d = borderDistM(res.lat, res.lng);
    S.lastFix = { m:d, at:Date.now() };
    if(ins === true){
      const br = nearestBridge(res.lat, res.lng);
      return failOn(c, "귀하는 아직 우두국 영토 안에 있습니다.",
        "출국 도장은 국경을 넘은 뒤에 발급됩니다. 다리를 건너 나가신 뒤 다시 신고하십시오."
        + (br ? ` 가장 가까운 검문소는 ${br.name}입니다.` : ""));
    }
    if(d > (CFG.exitBandM || 1000)){            // 설정이 비어도 띠가 꺼지지 않게
      return failOn(c, "국경에서 너무 멀리 떨어져 있습니다.",
        `출국 심사는 국경 일대에서만 진행됩니다. 현재 국경에서 약 ${d}m 떨어져 있습니다. `
        + "체류 기록은 유지되므로 다리를 건너 나가는 중에 다시 신고하시면 됩니다.");
    }
  }
  /* 모의 모드의 "국경 밖" 분기는 출국에서 뜻이 뒤집힌다 — 아직 안에 있음 */
  if(sim === "out"){
    return failOn(c, "귀하는 아직 우두국 영토 안에 있습니다.",
      "출국 도장은 국경을 넘은 뒤에 발급됩니다. 다리를 건너 나가신 뒤 다시 신고하십시오. 가장 가까운 검문소는 소양2교입니다.");
  }
  if(sim === "forbid"){
    return failOn(c, "해당 구역에서는 도장을 발급하지 않습니다.", forbidBody(null));
  }

  const br = res.ok && !S.sim ? nearestBridge(res.lat, res.lng) : null;
  c.via = br ? br.name : "소양2교";
  c.phase = "stamp"; render();
  dropStamp(`출국 도장이 발급되었습니다. ${c.via} 통과.`);

  await sleep(3000);                           // 도장 3초. 입국과 같은 무게로 둔다

  const p = S.pp;
  const e = lastOf(p.entries);
  const x = {
    at: c.date.toISOString(), entryAt: e.at,
    route: e.route, visa: e.visa, name: e.name,
    stayMin: Math.max(1, Math.round((c.date.getTime() - new Date(e.at).getTime())/60000)),
    wait: typeof e.wait === "number" ? e.wait : null,
    gak: gak().min, soup: soupCount(p), via: c.via, stamps: 0
  };
  p.exits.push(x);
  x.stamps = doneCount();        // 출국 심사가 과업 20이므로 발급한 뒤에 센다
  save(p);
  S.lastExit = x;

  c.phase = "report"; render();
}

function scrExit(root){
  const c = S.ex;
  if(!c || !S.pp) return go("passport");
  const stage = el("div",{ class:"stage" + (c.phase === "locating" ? " dark" : ""), id:"stage" });

  if(c.phase === "locating"){
    stage.appendChild(el("div",{ class:"stack-sm" },[
      el("div",{ html:`<svg class="surveyor" viewBox="0 0 100 100" aria-hidden="true"><g>
        <path d="M50 10 L50 90 M10 50 L90 50" stroke="rgba(250,247,240,.35)" stroke-width="1"/>
        <circle cx="50" cy="50" r="34" fill="none" stroke="rgba(250,247,240,.5)" stroke-width="1.5"/>
        <path d="M50 16 L58 28 L42 28 Z" fill="#FAF7F0"/></g></svg>` }),
      el("p",{ style:"letter-spacing:.3em;font-size:.98rem;margin-top:.8rem", text:"국경 통과 확인 중" })
    ]));
  }
  else if(c.phase === "stamp"){
    const wrap = el("div",{ class:"stamp-wrap", id:"swrap" });
    wrap.appendChild(stampEl(c.via, c.date, "exit"));
    stage.appendChild(wrap);
  }
  else if(c.phase === "report"){
    stage.appendChild(el("div",{ style:"width:100%;display:flex;justify-content:center" },[
      el("div",{ style:"transform:scale(.82);transform-origin:center" },[
        stampEl(c.via, c.date, "exit") ])
    ]));
  }
  else if(c.phase === "fail"){
    stage.appendChild(el("div",{ class:"stack", style:"text-align:left;width:100%" },[
      el("p",{ class:"eyebrow", style:"text-align:center", text:"심사 불가" }),
      el("p",{ style:"font-size:1.08rem;font-weight:700;line-height:1.6;text-align:center", text:c.failTitle }),
      el("hr",{ class:"rule" }),
      el("p",{ class:"note", text:c.failBody })
    ]));
  }

  root.appendChild(el("div",{ class:"stack" },[ stage ]));

  if(c.phase === "report"){
    const x = S.lastExit || {};
    const rows = [
      el("dt",{ text:"체류시간" }), el("dd",{ text:stayStr(x.stayMin) }),
      el("dt",{ text:"획득도장" }), el("dd",{ text:`${x.stamps} / ${MISSIONS.length}` }),
      el("dt",{ text:"섭취국량" }), el("dd",{ text: x.soup ? `${x.soup} 그릇` : "기록 없음" }),
      el("dt",{ text:"통과지점" }), el("dd",{ text:x.via || "소양2교" }),
      el("dt",{ text:"대기시간" }), el("dd",{ text: x.wait == null
        ? "신고 없음" : `국경 셔틀 ${x.wait}분 (국가가 기억합니다)` })   // 헌법 제5조
    ];
    if(x.wait != null){
      /* 신고가 그것 하나뿐이면 중간값이 자기 자신이라 "70분 → 70분"이 된다.
         화살표는 값이 실제로 움직였을 때만 쓴다 */
      rows.push(el("dt",{ text:"환율기여" }));
      rows.push(el("dd",{ class:"soft", text: x.wait === x.gak
        ? `${x.wait}분이 신고되어 오늘의 1각에 반영되었습니다`
        : `${x.wait}분 신고 → 오늘의 1각 ${x.gak}분으로 갱신` }));
    }
    root.appendChild(el("div",{ class:"stack", style:"margin-top:1.1rem" },[
      el("p",{ class:"eyebrow", text:"우두국 출국관리소" }),
      el("dl",{ class:"record" }, rows),
      x.soup ? null : el("p",{ class:"note",
        text:"헌법 제3조에 따라, 국을 먹지 않은 입국은 기록되지 않음을 알려드립니다." }),
      S.pp.founding ? el("div",{ class:"badge" },[
        el("b",{ text:"제1기 국경 통과자" }),
        el("span",{ text:"소양8교 개통 이후 발급되지 않습니다" })
      ]) : null,
      el("button",{ class:"btn btn-primary",
        onclick:()=>{ S.cardKind = "exit"; go("card"); }, text:"공유 카드 만들기" }),
      el("button",{ class:"btn btn-quiet", onclick:()=>go("passport"), text:`${idName()} 보기` })
    ]));
  }
  if(c.phase === "fail"){
    root.appendChild(el("div",{ class:"stack", style:"margin-top:1.1rem" },[
      el("button",{ class:"btn", onclick:()=>startExit(), text:"다시 신고" }),
      el("button",{ class:"btn btn-quiet", onclick:()=>go("passport"), text:`${idName()}으로` })
    ]));
  }
}

/* ─────────────────────────────────────────────────────────────
   S9 — 국토 측량

   이 앱의 본편이다. 입국과 출국은 들어오고 나간 사실을 확인하는 의식이고,
   측량은 모르는 것을 알아내는 일이다. 우두국은 아직 자기 땅을 모른다.

   과업 20개가 닫힌 체크리스트라면 측량은 열린 지도다. 무엇을 적을지는
   미리 정해두지 않는다. 다만 적는 것은 "장소"가 아니라 "장소 + 조건"이다 —
   해 질 무렵에만 보이는 것, 농사철에는 못 들어가는 길, 어느 각도에서
   소머리로 보이는가. 지도앱이 못 하는 자리가 거기다.

   판정 순서는 입국과 같다. 다만 측량은 영토 안에서만 한다.
     1 측량 시간 (헌법 제11조)
     2 위치 권한 / 측량 실패
     3 측위 정밀도 (maxAccM)
     4 금지 구역 (헌법 제12조) — 국경보다 먼저 본다
     5 영토 안인가

   기록은 기기에만 남는다. 사진은 IndexedDB, 나머지는 localStorage.
   전송 코드가 없다. 별점도 순위도 두지 않는다 — 측량은 평가가 아니라 관측이다.
   ───────────────────────────────────────────────────────────── */
function startSurvey(){
  audio();                                   // 사용자 제스처 안에서 오디오 잠금 해제
  S.sv = { phase:"locating", date: now(), kind:null, note:"", when:"", shot:null, res:null };
  go("surveyNew");
  runSurvey();
}
async function runSurvey(){
  const c = S.sv;

  if(!canSurvey(S.pp)){
    return failOn(c, "아직 입국하지 않았습니다.",
      "국토 측량은 입국한 뒤에 합니다. 들어오지 않은 나라의 땅을 재지는 않습니다.");
  }

  say("측량 지점을 확인하고 있습니다.");
  const [res] = await Promise.all([ locate(), sleep(1200) ]);   // 최소 1.2초. 의식이 아니라 도구다
  const sim = S.sim ? S.simCase : null;

  if(sim === "hours" || !withinHours(c.date)){
    return failOn(c, "측량 시간이 아닙니다.",
      "국토 측량은 07시부터 21시까지 합니다. 헌법 제11조에 따라, 밤에는 국민이 잠듭니다.");
  }
  if(sim === "denied" || (!S.sim && !res.ok && res.code === "denied")){
    return failOn(c, "위치 확인이 거부되었습니다.",
      "좌표 없는 기록은 국토에 올리지 않습니다. 어디였는지 모르는 보고는 다시 찾아갈 수 없습니다.");
  }
  if(!S.sim && !res.ok){
    return failOn(c, "측량에 실패했습니다.", "잠시 후 다시 시도하십시오.");
  }

  if(!S.sim){
    if(res.acc > CFG.maxAccM){
      return failOn(c, "측량 정밀도가 부족합니다.",
        `오차가 약 ${Math.round(res.acc)}m 입니다. 이 정밀도로 기록하면 지점이 틀어집니다. 하늘이 보이는 곳에서 다시 시도하십시오.`);
    }
    /* 금지 구역이 국경보다 먼저다. 주거지 안의 "숨은 장소"는 기록하지 않는다 */
    const zone = nearExcluded(res.lat, res.lng, res.acc || 0);
    if(zone) return failOn(c, "이 구역은 측량하지 않습니다.", forbidBody(zone));

    const ins = inside(res.lat, res.lng);
    if(ins === null){
      return failOn(c, "국경을 판정할 수 없습니다.",
        "국경 좌표가 등록되지 않았습니다. 우두국은 확인되지 않은 지점을 국토에 올리지 않습니다.");
    }
    if(ins === false){
      S.lastFix = { m: borderDistM(res.lat, res.lng), at: Date.now() };
      return failOn(c, "여기는 우두국 영토가 아닙니다.",
        `국경까지 약 ${S.lastFix.m}m 남았습니다. 국토 안에서 측량하십시오.`);
    }
    S.lastFix = { m:0, at: Date.now() };
  }
  if(sim === "out"){
    return failOn(c, "여기는 우두국 영토가 아닙니다.", "국토 안에서 측량하십시오.");
  }
  if(sim === "forbid"){
    return failOn(c, "이 구역은 측량하지 않습니다.", forbidBody(null));
  }

  c.res = res;
  c.phase = "form"; render();
  say("측량 지점이 확인되었습니다. 무엇을 보았는지 적으십시오.");
}

async function saveSurvey(){
  const c = S.sv, p = S.pp;
  const err = document.getElementById("svErr");
  const note = (c.note || "").trim();
  if(!c.kind || !note){
    if(err) err.textContent = !c.kind ? "분류를 고르십시오." : "무엇을 보았는지 한 줄 적으십시오.";
    say(err ? err.textContent : "");
    return;
  }
  const at = now();
  const id = "sv-" + at.getTime();
  const r = c.res || {};
  let shot = null;
  if(c.shot) shot = (await putShot(id, c.shot)) ? id : null;

  p.survey.push({
    id, at: at.toISOString(), kind: c.kind, note,
    when: (c.when || "").trim() || null,         // 조건 — 시각·계절·각도. 여기가 핵심이다
    coord: r.ok ? [+r.lat.toFixed(6), +r.lng.toFixed(6)] : null,
    accM:  r.ok ? Math.round(r.acc) : null,
    shot
  });
  /* 측량한 자리는 당연히 밟은 자리다. 따로 또 누르게 하지 않는다 (같은 날 한 번 규칙은 그대로) */
  if(r.ok){
    const cell = cellAt(r.lat, r.lng);
    if(cell){
      const today = dayKey(at.toISOString());
      const cur = p.steps[cell.id] || { n:0, first:null, last:null };
      if(cur.last !== today){
        cur.n += 1; cur.last = today; cur.first = cur.first || today;
        p.steps[cell.id] = cur;
      }
      S.here = { id:cell.id, day:today };
    }
  }
  save(p);

  c.date = at;
  c.phase = "stamp"; render();
  dropStamp(`측량 도장이 발급되었습니다. ${kindOf(c.kind).label}. ${note}`);
  await sleep(1400);                            // 입국의 3초보다 짧다. 자주 하는 일이다
  go("survey");
}

/* ─────────────────────────────────────────────────────────────
   S10 — 도면 (영토)

   밟기는 측량보다 가벼운 행위다. 한 번 누르면 지금 선 칸이 하루치 쌓인다.
   같은 칸은 하루에 한 번만 센다 — "많이 간 만큼"이 실제로 여러 날 갔다는 뜻이어야 한다.
   판정 순서는 다른 화면과 같고, 영토는 territory 로 본다 (좌표가 이미 있다).
   ───────────────────────────────────────────────────────────── */
async function stepHere(){
  audio();
  const p = S.pp;
  /* 노드를 미리 잡아두면 안 된다 — render() 가 지나가면 그건 떨어져 나간 노드다 */
  const say2 = t => { const b = document.getElementById("stepNote"); if(b) b.textContent = t; say(t); };
  if(!canSurvey(p)) return say2("입국한 뒤에 밟을 수 있습니다.");
  const sim0 = S.sim ? S.simCase : null;
  if(sim0 === "hours" || !withinHours(now()))
    return say2("밟기는 07시부터 21시까지 셉니다. 헌법 제11조에 따라, 밤에는 국민이 잠듭니다.");

  say2("발 디딘 자리를 확인하고 있습니다.");
  const res = await locate();
  const sim = S.sim ? S.simCase : null;
  if(sim === "denied" || (!res.ok && res.code === "denied"))
    return say2("위치 확인이 거부되었습니다. 밟은 자리를 셀 수 없습니다.");
  if(!res.ok) return say2("위치를 확인할 수 없습니다. 잠시 후 다시 시도하십시오.");
  if(res.acc > CFG.maxAccM)
    return say2(`측량 오차가 약 ${Math.round(res.acc)}m 입니다. 이 정밀도로는 칸을 가릴 수 없습니다.`);
  const zone = sim === "forbid" ? {} : nearExcluded(res.lat, res.lng, res.acc || 0);
  if(zone) return say2("이 구역은 세지 않습니다. " + forbidBody(zone.reason ? zone : null));
  if(sim === "out") return say2("여기는 우두국 영토가 아닙니다.");

  const cell = cellAt(res.lat, res.lng);
  if(!cell) return say2("여기는 우두국 영토가 아닙니다. 국토 안에서 밟아 주십시오.");

  const today = dayKey(new Date().toISOString());
  p.steps = p.steps || {};
  const cur = p.steps[cell.id] || { n:0, last:null, first:null };
  if(cur.last === today){
    S.here = { id:cell.id, day:today }; render();
    return say2(`오늘은 이 칸을 이미 셌습니다. ${held(p,cell.id)}일 / ${CFG.holdDays}일.`);
  }
  const fresh = cur.n === 0;
  cur.n += 1; cur.last = today; cur.first = cur.first || today;
  p.steps[cell.id] = cur;
  save(p);
  S.here = { id:cell.id, day:today };

  const now2 = cur.n, full = now2 >= CFG.holdDays;
  thunk(); buzz();                                    // 소리·진동·텍스트 3중
  render();
  say2(fresh ? `처음 밟은 칸입니다. 개척되었습니다. 1일 / ${CFG.holdDays}일.`
      : full  ? `이 칸이 꽉 찼습니다. ${now2}일 / ${CFG.holdDays}일.`
              : `${now2}일 / ${CFG.holdDays}일.`);
}

  }

  head.appendChild(el("button",{ class:"btn btn-primary", onclick:startSurvey,
    text:"지금 여기를 측량한다" }));

  if(!all.length){
    head.appendChild(el("p",{ class:"note", style:"line-height:1.8",
      text:"아직 측량된 국토가 없습니다. 우두국은 자기 땅을 모릅니다. "
         + "걸어 다니며 눈에 들어온 것을 한 줄씩 적어 주십시오. "
         + "언제 봐야 보이는지를 함께 적어 두면, 그 시각이 돌아올 때 다시 알려드립니다. "
         + "기록은 이 기기에만 남고 어디에도 전송되지 않습니다." }));
  } else {
    const rows = el("div",{ class:"stack-sm" });
    all.forEach(r => rows.appendChild(svRow(r)));
    head.appendChild(rows);
  }

  head.appendChild(el("button",{ class:"lnk", onclick:()=>go("passport"),
    text: isNational(p) ? "국민증으로" : "여권으로" }));
}

/* 홈에 올라오는 "지금" 블록. 맞는 게 없으면 아예 뜨지 않는다 — 0곳을 매번 보여주면 소음이다 */
function nowBlock(){
  const { list, sunset } = nowMatches();
  if(!list.length) return null;
  const box = el("div",{},[
    el("p",{ class:"eyebrow", text:"지금" }),
    el("p",{ class:"note", style:"margin:.5rem 0 .7rem",
      text:`지금과 같은 시각에 적어 둔 자리가 ${list.length}곳 있습니다.`
         + (sunset ? ` 오늘 일몰은 ${hhmm(sunset)}입니다.` : "") })
  ]);
  const rows = el("div",{ class:"stack-sm" });
  list.slice(0,3).forEach(m => rows.appendChild(el("div",{ class:"sv" },[
    el("div",{ class:"b" },[
      el("p",{ class:"t" },[ kindIcon(m.s.kind), el("span",{ text:m.s.note }) ]),
      el("p",{ class:"w", text:m.s.when }),
      el("p",{ class:"m",
        text:`${kindOf(m.s.kind).label} · ${m.why} · ${dateStr(new Date(m.s.at)).slice(5)} 기록` })
    ])
  ])));
  box.appendChild(rows);
  if(list.length > 3) box.appendChild(el("p",{ class:"note", style:"margin-top:.5rem",
    text:`그 밖에 ${list.length - 3}곳이 더 있습니다.` }));
  return box;
}

function svRow(r){
  const d = new Date(r.at);
  const del = el("button",{ class:"x", text:"삭제",
    "aria-label":`${r.note} 측량 보고 삭제` });
  del.addEventListener("click", () => {
    /* 두 번 눌러야 지워진다. 들에서 잘못 누르는 일이 잦다 */
    if(del.dataset.armed !== "1"){
      del.dataset.armed = "1"; del.textContent = "삭제 확인"; return;
    }
    S.pp.survey = S.pp.survey.filter(x => x.id !== r.id);
    save(S.pp); render();
    say("측량 보고를 삭제했습니다.");
  });

  const kids = [];
  if(r.shot){
    const img = el("img",{ alt:`${r.note} 측량 사진` });
    /* 기기 저장소가 비워졌으면 사진이 없다. 깨진 이미지 아이콘을 남기지 않는다 */
    getShot(r.shot).then(b => { if(b) img.src = URL.createObjectURL(b); else img.remove(); });
    kids.push(img);
  }
  /* 적은 한 줄이 머리글이다. 분류는 픽토그램으로 앞에 세우고 이름은 아래 줄로 내린다 */
  kids.push(el("div",{ class:"b" },[
    el("p",{ class:"t" },[ kindIcon(r.kind), el("span",{ text:r.note }) ]),
    r.when ? el("p",{ class:"w", text:r.when }) : null,
    el("p",{ class:"m",
      text:`${kindOf(r.kind).label} · ${timeStr(d)}${r.accM != null ? ` · 오차 ${r.accM}m` : ""}` })
  ]));
  kids.push(del);
  return el("div",{ class:"sv" }, kids);
}

/* S4 — 여권 홈 */
const CELL_REG = `<svg class="cell-reg" viewBox="0 0 64 64" fill="none" stroke="currentColor"
  stroke-width="1.8" stroke-linecap="square" aria-hidden="true">
  <path d="M14 22V14H22"/><path d="M42 14H50V22"/>
  <path d="M14 42V50H22"/><path d="M42 50H50V42"/></svg>`;

        el("div",{ class:"meta" },[

/* S7 — 공유 카드 */
/* 어느 카드를 그리는가. 승인서와 리포트가 들어오는 길에 정해 두고,
   정해지지 않았으면 입국 카드다. 출국 기록이 없으면 출국 카드도 없다. */
function exitRecord(){
  if(S.cardKind !== "exit") return null;
  return S.lastExit || lastOf(S.pp && S.pp.exits);
}
function scrCard(root){
  const ex = exitRecord();
  const box = el("div",{ class:"cardbox" });
  const cv = el("canvas",{ width:1080, height:1350, role:"img",
    "aria-label": ex
      ? "우두국 출국 카드. 출국 도장과 체류 리포트가 담긴 공유용 이미지."
      : "우두국 입국 카드. 입국 도장과 체류 기록이 담긴 공유용 이미지." });
  box.appendChild(cv);

  const actions = el("div",{ class:"stack", style:"margin-top:1.1rem" });
  root.appendChild(el("div",{ class:"stack" },[
    el("p",{ class:"eyebrow", text: ex ? "출국 카드" : "입국 카드" }),
    box,
    actions,
    el("button",{ class:"lnk", onclick:()=>go("passport"), text:`${idName()}으로` })
  ]));

  drawCard(cv).then(() => {
    actions.appendChild(el("button",{ class:"btn btn-primary", onclick:()=>shareCard(cv), text:"공유하기" }));
    actions.appendChild(el("p",{ class:"note", id:"shareNote",
      text:"기기에서 공유나 저장이 막혀 있으면 길게 눌러 이미지를 저장할 수 있습니다." }));
  });
}

async function drawCard(cv){
  const x = cv.getContext("2d");
  const ex = exitRecord();                   // 있으면 출국 카드를 그린다
  /* 새로 연 세션에는 S.lastEntry 가 없다. 여권에 남은 마지막 입국으로 복구한다 —
     안 그러면 여권에서 연 입국 카드가 "체류 —, 비자 —"로 그려진다 */
  const en = S.lastEntry || lastOf(S.pp && S.pp.entries) || {};
  const cs = getComputedStyle(document.body);
  const C = n => cs.getPropertyValue(n).trim();
  const paper = C("--paper") || "#FAF7F0", ink = C("--ink") || "#2B2B28",
        river = C("--river") || "#16646B", hill = C("--hill") || "#D9A85A",
        seal = C("--seal") || "#C1382B";

  try{
    await document.fonts.load('700 86px "Noto Serif KR"');
    await document.fonts.load('400 24px "Noto Serif KR"');
    await document.fonts.ready;              // 이걸 안 기다리면 기본체로 그려진다
  }catch(e){}

  const W = 1080, H = 1350, P = 80;
  const F = (w,s) => `${w} ${s}px "Noto Serif KR", serif`;

  x.fillStyle = paper; x.fillRect(0,0,W,H);
  x.strokeStyle = river; x.globalAlpha = .055; x.lineWidth = 1;
  for(let i=0;i<W;i+=16){ x.beginPath(); x.moveTo(i+.5,0); x.lineTo(i+.5,H); x.stroke(); }
  for(let j=0;j<H;j+=16){ x.beginPath(); x.moveTo(0,j+.5); x.lineTo(W,j+.5); x.stroke(); }
  x.globalAlpha = 1;

  /* 국기 — flagSVG() 와 같은 도형. 540x360 과 114x76 이 둘 다 3:2 라
     가로세로 배율이 같고, 그래서 arc 가 타원으로 찌그러지지 않는다 */
  const fw = 114, fh = 76, fx = (W-fw)/2, fy = P;
  x.save(); x.translate(fx,fy); x.scale(fw/540,fh/360);
  x.fillStyle = paper; x.fillRect(0,0,540,360);
  x.fillStyle = hill; x.beginPath(); x.arc(270,180,105,0,Math.PI*2); x.fill();
  x.fillStyle = river; x.fillRect(0,248,540,112);
  x.restore();
  /* 테두리는 배율 밖에서 긋는다. 안에서 그으면 선 굵기까지 0.21배가 되어 사라진다 */
  x.strokeStyle = withA(ink,.24); x.lineWidth = 1;
  x.strokeRect(fx+.5, fy+.5, fw-1, fh-1);

  x.textAlign = "center"; x.fillStyle = ink;
  x.font = F(700,86); x.fillText(spaced("우두국",.16), W/2, fy+fh+112);
  x.font = F(400,23); x.fillStyle = withA(ink,.72);
  x.fillText(spaced(ex ? "출국관리소" : "입국관리소",.42), W/2, fy+fh+160);

  x.strokeStyle = withA(ink,.28); x.lineWidth = 1;
  line(x,P,fy+fh+200,W-P,fy+fh+200);

  /* 도장 — 출국 카드에서는 436×292 로 내린다. 주역이 도장이 아니라 수치다.
     테두리는 화면의 .stamp.exit 와 같이 점선으로 쓴다 */
  const k = ex ? .72 : 1;                    // 604→436 축소율. 선과 글자를 같이 줄인다
  const sw = Math.round(604*k), sh = Math.round(404*k), sx = W/2, sy = ex ? 560 : 700;
  x.save(); x.translate(sx,sy); x.rotate(-8*Math.PI/180);
  if(ex) x.setLineDash([18*k,12*k]);         // 간격도 같이 줄인다. 안 그러면 선에 비해 굵다
  x.strokeStyle = seal; x.lineWidth = 7*k;
  rr(x,-sw/2,-sh/2,sw,sh,12*k); x.stroke();
  x.lineWidth = 3*k; rr(x,-sw/2+17*k,-sh/2+17*k,sw-34*k,sh-34*k,6*k); x.stroke();
  x.setLineDash([]);
  x.save();
  rr(x,-sw/2+17*k,-sh/2+17*k,sw-34*k,sh-34*k,6*k); x.clip();  // 언덕이 테두리 밖으로 새지 않게
  x.globalAlpha = ex ? .075 : .1;            // 작은 도장에서는 언덕이 날짜를 덮는다
  x.translate(40*k,36*k); x.scale(2.6*k,2.6*k); x.translate(0,-20);
  x.fillStyle = seal; x.fill(new Path2D(HILL));
  x.restore();
  x.fillStyle = seal; x.textAlign = "center";
  x.font = F(400,29*k); x.fillText(spaced("우두국",.5), 0, -104*k);
  x.font = F(700,124*k); x.fillText(spaced(ex ? "출국" : "입국",.17), 0, 24*k);
  const sDate = ex ? ex.at : (en.at || Date.now());
  x.font = F(400,40*k); x.fillText(dateStr(new Date(sDate)), 0, 88*k);
  const rt = ex ? (ex.via || "소양2교")
               : (ROUTES.filter(r=>r.id===en.route)[0]||{}).label;
  x.font = F(400,22*k); x.fillText(spaced(rt||"소양2교",.2), 0, 136*k);
  x.restore();

  /* 출국 카드의 주역 — 대기 시간. 체류 시간보다 할 말이 많은 숫자다.
     신고가 없으면 체류 시간이 그 자리에 들어간다. 주인색은 도장에만 쓰므로 청록 */
  if(ex){
    const hasWait = ex.wait != null;
    x.textAlign = "center";
    x.fillStyle = withA(ink,.7); x.font = F(400,20);
    x.fillText(hasWait ? "국경 셔틀 대기 · 국가가 기억합니다" : "체류 시간", W/2, 816);
    x.fillStyle = river; x.font = F(700,82);
    x.fillText(hasWait ? `${ex.wait}분` : stayStr(ex.stayMin), W/2, 906);
  }

  // 수치 3개
  const ty = 1095;
  x.strokeStyle = withA(ink,.28);
  line(x,P,ty-66,W-P,ty-66); line(x,P,ty+86,W-P,ty+86);
  const visa = v => v.visa ? `${v.visa} · ${v.name}` : "—";
  const stats = !ex
    ? [["체류", dur(en)],
       ["도장", `${doneCount()} / ${MISSIONS.length}`],
       ["비자", visa(en)]]
    : ex.wait != null
    ? [["체류", stayStr(ex.stayMin)],
       ["도장", `${ex.stamps} / ${MISSIONS.length}`],
       ["비자", visa(ex)]]
    : [["도장", `${ex.stamps} / ${MISSIONS.length}`],
       ["섭취국량", ex.soup ? `${ex.soup} 그릇` : "—"],
       ["비자", visa(ex)]];
  const cw = (W-P*2)/3;
  stats.forEach((s,i) => {
    const cx2 = P + cw*i + cw/2;
    if(i){ x.strokeStyle = withA(ink,.22); line(x,P+cw*i,ty-46,P+cw*i,ty+66); }
    x.fillStyle = withA(ink,.7); x.font = F(400,19);
    x.fillText(spaced(s[0],.22), cx2, ty-16);
    /* 제일 긴 값은 "공훈 · 월경자". 폰트가 대체체로 떨어지면 넘치므로 재어서 줄인다 */
    x.fillStyle = i===2 ? river : ink;
    let fs = i===2 ? 34 : 42;
    x.font = F(700,fs);
    while(fs > 20 && x.measureText(s[1]).width > cw-24){ fs -= 2; x.font = F(700,fs); }
    x.fillText(s[1], cx2, ty+38);
  });

  // 하단
  x.textAlign = "left"; x.fillStyle = withA(ink,.72); x.font = F(400,20);
  x.fillText(`오늘의 1각 ${ex ? ex.gak : gak().min}분`, P, H-P);
  x.textAlign = "right"; x.fillStyle = withA(ink,.62); x.font = F(400,18);
  x.fillText("udu.example", W-P, H-P);
}
function dur(e){
  if(!e || !e.at) return "—";
  return stayStr((Date.now() - new Date(e.at).getTime())/60000);
}
function spaced(s,em){ return s.split("").join(em > .3 ? "  " : " "); }
function withA(c,a){
  const m = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(c.replace("#",""));
  if(!m) return c;
  return `rgba(${parseInt(m[1],16)},${parseInt(m[2],16)},${parseInt(m[3],16)},${a})`;
}
function line(x,a,b,c,d){ x.beginPath(); x.moveTo(a,b+.5); x.lineTo(c,d+.5); x.stroke(); }
function rr(x,a,b,w,h,r){
  x.beginPath(); x.moveTo(a+r,b);
  x.arcTo(a+w,b,a+w,b+h,r); x.arcTo(a+w,b+h,a,b+h,r);
  x.arcTo(a,b+h,a,b,r); x.arcTo(a,b,a+w,b,r); x.closePath();
}

async function shareCard(cv){
  const note = document.getElementById("shareNote");
  const blob = await new Promise(r => cv.toBlob(r, "image/png"));
  if(!blob){ if(note) note.textContent = "카드를 만들지 못했습니다. 다시 시도하십시오."; return; }
  const ex = exitRecord();
  const name = ex ? "udu-exit.png" : "udu-entry.png";
  const file = new File([blob], name, { type:"image/png" });

  try{
    if(navigator.canShare && navigator.canShare({ files:[file] })){
      await navigator.share({ files:[file], title: ex ? "우두국 출국" : "우두국 입국" });
      if(note) note.textContent = "공유를 전달했습니다.";
      return;
    }
  }catch(e){ /* 사용자 취소 또는 차단 */ }

  try{
    const dl = await (window.claude && window.claude.use ? window.claude.use("downloads") : null);
    if(dl){
      await dl.save({ filename:name, data:blob });
      if(note) note.textContent = "저장을 요청했습니다.";
      return;
    }
  }catch(e){}

  if(note) note.textContent = "이 환경에서는 공유와 저장이 막혀 있습니다. 카드를 길게 눌러 이미지를 저장하십시오.";
}

function scrMission(root){
  const m = MISSIONS.filter(x => x.id === S.mid)[0];
  if(!m || !S.pp) return go("missions");
  const p = S.pp, ok = mDone(m);
  const body = el("div",{ class:"stack" });

    el("p",{ class:"eyebrow", text:`과업 ${pad(m.id)} · ${m.cat}` }),

    }
  }
  else if(m.verify === "won"){
    body.appendChild(el("hr",{ class:"rule" }));
    const cur = p.nums[m.id];
    if(typeof cur === "number")
      body.appendChild(el("p",{ class:"big", text:`${cur.toLocaleString("ko-KR")}${m.unit}` }));
    const inp = el("input",{ type:"number", inputmode:"numeric", min:"0", step:"100",
      id:`n${m.id}`, placeholder:m.ph, "aria-label":`${m.stamp} 금액` });
    body.appendChild(el("div",{ class:"numrow" },[
      inp,
      el("button",{ class:"btn btn-primary", onclick:()=>{
        const v = parseInt(inp.value, 10);
        if(!isFinite(v) || v <= 0) return;
        p.nums[m.id] = v; save(p); render();
      }, text:"신고" })
    ]));
    body.appendChild(el("p",{ class:"note", text:"신고한 금액은 기기에만 남습니다." }));
  }
  else if(m.verify === "photo"){
    body.appendChild(el("hr",{ class:"rule" }));
    const shotList = p.shots[m.id] || [];
    const need = m.need || 1;
    body.appendChild(el("p",{ class:"note",
      text: m.days
        ? `각기 다른 날 ${need}장. 현재 ${distinctDays(shotList)}일 / ${need}일.`
        : `사진 ${need}장. 현재 ${shotList.length} / ${need}.` }));
    if(shotList.length){
      const shots = el("div",{ class:"shots" });
      shotList.forEach(s => {
        const img = el("img",{ alt:`${m.stamp} 인증 사진 ${dateStr(new Date(s.at))}` });

        getShot(s.key).then(b => { if(b) img.src = URL.createObjectURL(b); else img.remove(); });
      });

      onchange: async ev => {
        const f = ev.target.files && ev.target.files[0];
        if(!f) return;
        const blob = await shrink(f);
        if(!blob){ alertNote("사진을 읽을 수 없습니다."); return; }
        const key = `${m.id}-${Date.now()}`;
        const okSave = await putShot(key, blob);
        if(!okSave){ alertNote("이 기기에 사진을 저장할 수 없습니다."); return; }
        (p.shots[m.id] = p.shots[m.id] || []).push({ at:new Date().toISOString(), key });
        save(p); render();
      } });
    body.appendChild(el("label",{ class:"filelbl", for:`f${m.id}` },[
      el("span",{ text:"사진 추가" }), finp ]));
    body.appendChild(el("p",{ class:"note",
      text:"사진은 기기 안에만 저장되고 어디에도 전송되지 않습니다." }));

  else if(m.verify === "timer"){
    body.appendChild(el("hr",{ class:"rule" }));
    if(p.timer){
      const n = el("p",{ class:"big" });
      const upd = () => {
        const s = Math.max(0, Math.floor((Date.now() - p.timer)/1000));
        n.textContent = `${pad(Math.floor(s/60))}:${pad(s%60)}`;

      upd(); S.tick = setInterval(upd, 1000);
      body.appendChild(el("p",{ class:"eyebrow", style:"text-align:center", text:"대기 중" }));
      body.appendChild(n);
      body.appendChild(el("button",{ class:"btn btn-primary", onclick:()=>{
        const min = Math.max(1, Math.round((Date.now() - p.timer)/60000));
        p.waits.push(min); p.timer = null; p.done[m.id] = new Date().toISOString();
        save(p); render();
      }, text:"셔틀 도착" }));
      body.appendChild(el("button",{ class:"btn btn-quiet", onclick:()=>{
        p.timer = null; save(p); render();
      }, text:"측정 취소" }));
    } else {
      body.appendChild(el("button",{ class:"btn btn-primary", onclick:()=>{
        p.timer = Date.now(); save(p); render();
      }, text:"대기 시작" }));
      body.appendChild(el("p",{ class:"note",
        text:`신고한 대기 시간이 시간본위제 환율을 만듭니다. 오늘의 1각은 ${gak().min}분입니다.` }));

  }
  else if(m.verify === "geo"){
    body.appendChild(el("hr",{ class:"rule" }));
    if(ok){
      body.appendChild(el("p",{ class:"note", text:`${dateStr(new Date(p.done[m.id]))}에 발급되었습니다.` }));
    } else if(geoReady(m)){

        const rec = (p.geo || {})[m.id] || {};
        body.appendChild(el("ul",{ class:"ck" }, m.points.map(pt => el("li",{},[
          el("span",{ text:pt.name }),

        ]))));
        if(m.sameDay) body.appendChild(el("p",{ class:"note", text:"같은 날에 모두 방문해야 발급됩니다." }));
      }
      body.appendChild(el("button",{ class:"btn btn-primary", onclick:()=>checkGeo(m), text:"현재 위치로 인증" }));
    } else {
      body.appendChild(el("p",{ html:'<span class="tag">답사 전 · 좌표 미확정</span>' }));
      body.appendChild(el("p",{ class:"note",
        text:"이 과업의 좌표가 아직 비어 있습니다. 답사에서 확정하면 위치 인증이 열립니다." }));
      if(S.sim) body.appendChild(el("button",{ class:"btn btn-quiet", onclick:()=>{
        p.done[m.id] = new Date().toISOString(); save(p); render();
      }, text:"모의 완료" }));
    }
  }
  else if(m.verify === "read"){
    body.appendChild(el("hr",{ class:"rule" }));
    if(!ok) body.appendChild(el("button",{ class:"btn btn-primary", onclick:()=>{
      p.done[m.id] = new Date().toISOString(); save(p); render();
    }, text:"읽음" }));
  }

  if(m.read){
    body.appendChild(el("hr",{ class:"rule" }));
    body.appendChild(scriptBlock(HISTORY[m.read]));
    if(m.read2){
      if(p.done[m.id + "b"]){
        body.appendChild(el("hr",{ class:"rule" }));
        body.appendChild(scriptBlock(HISTORY[m.read2]));
      } else {
        body.appendChild(el("button",{ class:"btn btn-quiet", onclick:()=>{
          p.done[m.id + "b"] = new Date().toISOString(); save(p); render();
        }, text:`${HISTORY[m.read2].sub} 이어 듣기` }));

    }
  }

  body.appendChild(el("button",{ class:"lnk", onclick:()=>go("missions"), text:"과업 목록으로" }));
  root.appendChild(body);

function scriptBlock(h){
  if(!h) return el("div");
  const box = el("div",{},[ el("p",{ class:"eyebrow", text:h.sub }) ]);
  const sc = el("div",{ class:"script", style:"margin-top:.9rem" });
  h.body.forEach(b => {
    if(typeof b === "string") sc.appendChild(el("p",{ text:b }));
    else if(b.q) sc.appendChild(el("p",{ class:"q", text:b.q }));
    else if(b.slot) sc.appendChild(el("p",{ class:"slot", text:b.slot }));
  });
  box.appendChild(sc);
  return box;
}

/* m.points 를 가진 과업이 충족됐는가. sameDay 면 한 날에 전 지점을 찍어야 한다 */
function geoSatisfied(m, p){
  if(!m.points) return false;
  const rec = (p.geo || {})[m.id] || {};
  if(!m.sameDay) return m.points.every(pt => !!rec[pt.key]);
  const byDay = {};
  m.points.forEach(pt => {
    const at = rec[pt.key]; if(!at) return;
    const d = dayKey(at);
    (byDay[d] = byDay[d] || {})[pt.key] = 1;
  });
  return Object.keys(byDay).some(d => Object.keys(byDay[d]).length >= m.points.length);
}

async function checkGeo(m){
  if(!geoReady(m)){ alertNote("이 과업의 좌표가 아직 확정되지 않았습니다."); return; }

  const r = await locate();
  if(!r.ok){
    alertNote(r.code === "denied" ? "위치 확인이 거부되었습니다. 위치 권한을 허용해 주십시오."
                                 : "위치를 확인할 수 없습니다.");
    return;
  }
  if(r.acc > CFG.maxAccM){
    alertNote(`측량 오차가 약 ${Math.round(r.acc)}m 입니다. 이 정밀도로는 판정하지 않습니다.`);
    return;
  }
  /* 금지 구역이 과업보다 먼저다. 과업 지점이 구역에 걸쳐 있어도 도장은 없다 */
  const zone = nearExcluded(r.lat, r.lng, r.acc || 0);
  if(zone){ alertNote("해당 구역에서는 도장을 발급하지 않습니다. 헌법 제12조."); return; }

  if(!withinHours(now())){
    alertNote("과업 인증은 07시부터 21시까지 가능합니다. 헌법 제11조.");
    return;
  }
  const n = nearPoint(r.lat, r.lng, m);
  if(!n || !n.ok){
    const need = (n && n.point && n.point.radiusM) || m.radiusM || 30;
    const where = n && n.point && n.point.name ? `가장 가까운 지점(${n.point.name})` : "과업 지점";
    alertNote(n ? `${where}에서 약 ${n.m}m 떨어져 있습니다. ${need}m 안으로 들어가십시오.`
                : "과업 지점을 판정할 수 없습니다.");
    return;
  }
  /* 과업이 자체 조건을 더 걸고 있으면 (예: 일몰 전후) 여기서 본다 */
  if(m.when){
    const v = m.when(now(), r);
    if(!v.ok){ alertNote(v.why); return; }
  }

  const p = S.pp;
  const at = new Date().toISOString();
  if(m.points){
    p.geo[m.id] = p.geo[m.id] || {};
    p.geo[m.id][n.point.key] = at;
    if(geoSatisfied(m, p)) p.done[m.id] = at;
    else {
      const rec = p.geo[m.id];
      const left = m.points.filter(pt => !rec[pt.key]).map(pt => pt.name).join(", ");
      save(p); render();
      alertNote(n.point.name
        ? `${n.point.name} 방문이 기록되었습니다.${left ? ` 남은 지점: ${left}` : " 같은 날에 모두 방문해야 합니다."}`
        : "방문이 기록되었습니다.");
      return;
    }
  } else {
    p.done[m.id] = at;
  }
  thunk(); buzz();                   // 소리·진동·텍스트 3중
  save(p); render();
  say(`${m.stamp} 도장이 발급되었습니다.`);
  alertNote(`${m.stamp} 도장이 발급되었습니다.`);
}
function alertNote(t){
  const app = document.getElementById("app");
  app.insertBefore(el("p",{ class:"note", style:"color:var(--seal)", text:t }), app.firstChild);
}

render();
</script>
